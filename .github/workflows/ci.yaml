# ADR 0022: rendered/ + CODEOWNERS are committed on the PR, not after merge. Every PR run renders the
# affected capabilities and comments the diff against the base; once the PR is ready for review, CI commits
# the render to the PR branch (drafts: comment only). main only checks for drift; no bot commit lands there.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read           # the render commit is pushed with RENDER_BOT_TOKEN
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # .mise.toml evaluates `gh auth token` for GITHUB_AUTH_TOKEN; gh uses GH_TOKEN on runners
      GH_TOKEN: ${{ github.token }}
    steps:
      # PR: the head commit (not the merge ref), so a render commit can be pushed onto its branch; pushed with
      # RENDER_BOT_TOKEN so the new commit re-runs CI (GITHUB_TOKEN pushes don't). Forks get no secret.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.RENDER_BOT_TOKEN || github.token }}
      - uses: jdx/mise-action@v2   # pinned tools from .mise.toml (cue, jq, yq)
        with:
          install_args: cue jq yq go
      - uses: actions/cache@v4
        with: {path: ~/.cache/cue, key: "cue-${{ hashFiles('platform/cue.mod/module.cue') }}"}
      - name: go cache dirs
        id: go
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # module + build cache for platform/cli (go vet/test, gcd build); key: Go version + go.sum
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('platform/cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-

      - name: renderer tests
        run: mise run test && cue fmt --check ./platform/render/...
      - name: editor schemas up to date
        run: mise run schemas && git diff --exit-code platform/render/schemas/
      - name: region-derived config up to date (clusters.cue)
        run: mise run regions && git diff --exit-code platform/cluster/regions platform/infrastructure/keycloak platform/infrastructure/kargo/values.yaml

      - name: lint all capabilities (annotates file:line)
        run: |
          set -o pipefail
          mise run lint | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'

      # PR: only what the change affects (scripts/affected.sh); main: everything (drift check)
      - name: render
        env:
          BASE: ${{ github.server_url }}/${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git fetch -q "$BASE" "$BASE_REF"
            git diff --name-only FETCH_HEAD...HEAD | platform/render/scripts/render-affected.sh . rendered
          else
            mise run render
          fi
          git add -A rendered .github/CODEOWNERS

      - name: rendered diff
        id: diff
        run: |
          base="$([[ "$GITHUB_EVENT_NAME" == pull_request ]] && echo FETCH_HEAD || echo HEAD)"
          git diff --cached --stat "$base" -- rendered .github/CODEOWNERS
          { echo 'body<<EOF'
            echo '### Rendered manifest diff'
            if git diff --cached --quiet "$base" -- rendered; then echo '_no changes_'; else
              echo '```diff'; git diff --cached "$base" -- rendered | head -c 60000; echo '```'; fi
            echo EOF; } >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet HEAD -- rendered .github/CODEOWNERS; then echo "stale=false" >> "$GITHUB_OUTPUT"
          else echo "stale=true" >> "$GITHUB_OUTPUT"; fi

      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.diff.outputs.body }}
        run: gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "$BODY"

      # ready PRs on this repo only; never on `opened` (draft-first.yaml turns a non-draft PR into a draft).
      # If the branch moved meanwhile the push is rejected; the newer run renders it.
      - name: commit rendered/ to the PR branch
        id: commit
        if: >-
          github.event_name == 'pull_request' && steps.diff.outputs.stale == 'true' &&
          !github.event.pull_request.draft && github.event.action != 'opened' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "render: ${HEAD_SHA::7}"
          git push -q origin "HEAD:refs/heads/$HEAD_REF"

      # required check (branch protection on main, with "branches up to date"). Drafts pass: they can't merge,
      # and render on ready. A pushed render commit passes here; its own run re-checks it.
      - name: rendered up to date
        if: steps.diff.outputs.stale == 'true' && steps.commit.outcome != 'success'
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "::error::rendered/ on main differs from a fresh render (merged without an up-to-date render?); run mise run render and open a PR"; exit 1
          fi
          [[ "$DRAFT" == true ]] && { echo "draft: rendered/ is committed once the PR is ready for review"; exit 0; }
          echo "::error::rendered/ is stale: mark the PR ready for review (same-repo branches), or run mise run render and push"; exit 1
