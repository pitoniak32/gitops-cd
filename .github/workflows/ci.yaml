# ADR 0022: rendered/ lives on the orphan branch `rendered`, written only by this workflow on pushes to main;
# main gets no bot commits. PRs comment the render diff against it. CODEOWNERS stays on main (GitHub reads it
# there): authors regenerate it with `mise run codeowners`, CI checks it.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write          # push to the rendered branch (GITHUB_TOKEN: doesn't re-trigger workflows)
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # .mise.toml evaluates `gh auth token` for GITHUB_AUTH_TOKEN; gh uses GH_TOKEN on runners
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2   # pinned tools from .mise.toml (cue, jq, yq)
        with:
          install_args: cue jq yq go
      - uses: actions/cache@v4
        with: {path: ~/.cache/cue, key: "cue-${{ hashFiles('platform/cue.mod/module.cue') }}"}
      - name: go cache dirs
        id: go
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # module + build cache for platform/cli (go vet/test, gcd build); key: Go version + go.sum
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('platform/cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-

      - name: rendered/ lives on the rendered branch
        if: github.event_name == 'pull_request'
        run: |
          # added/modified only: deleting rendered/ from main is fine
          if git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" | grep -E '^rendered/'; then
            echo "::error::rendered/ is generated onto the rendered branch by CI after merge (ADR 0022); remove it from this PR"; exit 1
          fi

      - name: renderer tests
        run: mise run test && cue fmt --check ./platform/render/...
      - name: editor schemas up to date
        run: mise run schemas && git diff --exit-code platform/render/schemas/
      - name: region-derived config up to date (clusters.cue)
        run: mise run regions && git diff --exit-code platform/cluster/regions platform/infrastructure/keycloak platform/infrastructure/kargo/values.yaml

      - name: lint all capabilities (annotates file:line)
        run: |
          set -o pipefail
          mise run lint | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'

      # PRs fail; on main only warn, so a stale CODEOWNERS (two PRs that each passed) never blocks the render
      - name: CODEOWNERS up to date
        run: |
          mise run codeowners >/dev/null
          git diff --exit-code .github/CODEOWNERS && exit 0
          lvl="$([[ "$GITHUB_EVENT_NAME" == pull_request ]] && echo error || echo warning)"
          echo "::$lvl file=.github/CODEOWNERS::stale; run mise run codeowners and commit it in a PR"
          [[ "$lvl" == warning ]]

      - name: render
        run: mise run render   # writes rendered/ (gitignored on main)

      # worktree of the rendered branch (empty orphan before the first render) with the fresh render in it
      - name: rendered diff
        id: diff
        run: |
          rb="$RUNNER_TEMP/rendered-branch"
          # missing branch (first render): orphan; any other git error fails the run
          if git ls-remote --exit-code --heads origin rendered >/dev/null; then
            git fetch -q origin rendered && git worktree add -q --detach "$rb" FETCH_HEAD
          elif [[ $? == 2 ]]; then git worktree add -q --orphan -b rendered "$rb"
          else exit 1; fi
          mkdir -p "$rb/rendered" && rsync -a --delete rendered/ "$rb/rendered/"
          git -C "$rb" add -A
          git -C "$rb" diff --cached --stat
          # -U8: 8 lines of context per change; capped below GitHub's 65536-char comment limit
          { echo 'body<<EOF'
            echo '### Rendered manifest diff (vs the rendered branch)'
            if git -C "$rb" diff --cached --quiet; then echo '_no changes_'; else
              echo '```diff'; git -C "$rb" diff --cached -U8 | head -c 60000; echo '```'; fi
            echo EOF; } >> "$GITHUB_OUTPUT"

      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.diff.outputs.body }}
        run: gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "$BODY"

      # pushes to main run one at a time (concurrency group); each replaces the branch's tree with its render
      - name: commit render to the rendered branch
        if: github.event_name == 'push'
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          # a re-run of an older push must not roll the branch back to its older render
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$head" == "$GITHUB_SHA" ]] || { echo "::warning::$GITHUB_SHA is no longer main's head ($head); not committing its render"; exit 0; }
          cd "$RUNNER_TEMP/rendered-branch"
          git diff --cached --quiet && { echo "render unchanged"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "render: ${GITHUB_SHA::7}" -m "source: $SOURCE"
          git push -q origin HEAD:refs/heads/rendered
