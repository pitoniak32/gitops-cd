name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["rendered/**", ".github/CODEOWNERS"]   # the render commit itself doesn't re-trigger
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CUE_VERSION: v0.17.0
jobs:
  ci:
    runs-on: ubuntu-latest   # has jq + yq (mikefarah v4)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.event_name == 'push' && secrets.RENDER_BOT_TOKEN || github.token }}
      - name: install cue
        run: curl -fsSL "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin cue
      - uses: actions/cache@v4
        with: {path: ~/.cache/cue, key: "cue-${{ hashFiles('platform/cue.mod/module.cue') }}"}

      - name: rendered/ and CODEOWNERS are CI-owned
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if grep -E '^rendered/(apps|platform|pipelines|codeowners)/' <<<"$changed"; then
            echo "::error::rendered/ is generated by CI after merge; revert these files"; exit 1
          fi
          if grep -qx '.github/CODEOWNERS' <<<"$changed"; then
            echo "::error file=.github/CODEOWNERS::generated; edit .github/CODEOWNERS.tmpl or owners.yml instead"; exit 1
          fi

      - name: platform tests
        run: platform/scripts/test.sh && cue fmt --check ./platform/...
      - name: editor schemas up to date
        run: platform/scripts/schemas.sh && git diff --exit-code platform/schemas/

      - name: lint all capabilities (annotates file:line)
        run: |
          set -o pipefail
          scripts/lint.sh | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'

      - name: render
        run: scripts/render.sh

      - name: rendered diff
        id: diff
        run: |
          git add -A rendered .github/CODEOWNERS
          git diff --cached --stat rendered .github/CODEOWNERS
          { echo 'body<<EOF'
            echo '### Rendered manifest diff'
            if git diff --cached --quiet rendered; then echo '_no changes_'; else
              echo '```diff'; git diff --cached rendered | head -c 60000; echo '```'; fi
            echo EOF; } >> "$GITHUB_OUTPUT"

      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.diff.outputs.body }}
        run: gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "$BODY"

      - name: commit rendered/ to main
        if: github.event_name == 'push'
        run: |
          git diff --cached --quiet rendered .github/CODEOWNERS && exit 0
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com \
            commit -qm "render: ${GITHUB_SHA::7}" -m "source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git push -q origin HEAD:main
