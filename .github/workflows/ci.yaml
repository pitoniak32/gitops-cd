name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["rendered/**", ".github/CODEOWNERS"]   # the render commit itself doesn't re-trigger
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # .mise.toml evaluates `gh auth token` for GITHUB_AUTH_TOKEN; gh uses GH_TOKEN on runners
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.event_name == 'push' && secrets.RENDER_BOT_TOKEN || github.token }}
      - uses: jdx/mise-action@v2   # pinned tools from .mise.toml (cue, jq, yq)
        with:
          install_args: cue jq yq go
      - uses: actions/cache@v4
        with: {path: ~/.cache/cue, key: "cue-${{ hashFiles('platform/cue.mod/module.cue') }}"}
      - name: go cache dirs
        id: go
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # module + build cache for platform/cli (go vet/test, gcd build); key: Go version + go.sum
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('platform/cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-

      - name: rendered/ and CODEOWNERS are CI-owned
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if grep -E '^rendered/(apps|argocd|kargo|pipelines|codeowners|infrastructure)/' <<<"$changed"; then
            echo "::error::rendered/ is generated by CI after merge; revert these files"; exit 1
          fi
          if grep -qx '.github/CODEOWNERS' <<<"$changed"; then
            echo "::error file=.github/CODEOWNERS::generated; edit .github/CODEOWNERS.tmpl or owners.yml instead"; exit 1
          fi

      - name: renderer tests
        run: mise run test && cue fmt --check ./platform/render/...
      - name: editor schemas up to date
        run: mise run schemas && git diff --exit-code platform/render/schemas/
      - name: region-derived config up to date (clusters.cue)
        run: mise run regions && git diff --exit-code platform/cluster/regions platform/infrastructure/keycloak platform/infrastructure/kargo/values.yaml

      - name: lint all capabilities (annotates file:line)
        run: |
          set -o pipefail
          mise run lint | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'

      - name: render
        run: mise run render

      - name: rendered diff
        id: diff
        run: |
          git add -A rendered .github/CODEOWNERS
          git diff --cached --stat rendered .github/CODEOWNERS
          { echo 'body<<EOF'
            echo '### Rendered manifest diff'
            if git diff --cached --quiet rendered; then echo '_no changes_'; else
              echo '```diff'; git diff --cached rendered | head -c 60000; echo '```'; fi
            echo EOF; } >> "$GITHUB_OUTPUT"

      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.diff.outputs.body }}
        run: gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "$BODY"

      - name: commit rendered/ to main
        if: github.event_name == 'push'
        run: |
          git diff --cached --quiet rendered .github/CODEOWNERS && exit 0
          git -c user.name="github-actions[bot]" -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "render: ${GITHUB_SHA::7}" -m "source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git push -q origin HEAD:main
