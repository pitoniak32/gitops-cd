# Example deploy workflow for CLOUD_RUN targets (ADR 0024). Kargo's target Stage pushes the target branch
# (service.yaml with the container image pinned to <repo>:<tag>@<digest>), dispatches this workflow with the
# pushed commit + pinned image, and waits up to 30m; the run's conclusion passes or fails the Promotion.
# Demo only: nothing is deployed (no GCP here); the real steps are commented below.
name: deploy cloud run (example)
run-name: "cloud run ${{ inputs.system }}/${{ inputs.app }} → ${{ inputs.target }} (${{ inputs.image }})"
on:
  workflow_dispatch:
    inputs:
      system: {description: system, required: true, type: string}
      app: {description: app, required: true, type: string}
      stage: {description: stage, required: true, type: string}
      target: {description: target, required: true, type: string}
      commit: {description: "env/<sys>/<app>/<target> commit Kargo pushed", required: true, type: string}
      image: {description: "<repo>:<tag>@<digest> from the Freight", required: true, type: string}
permissions:
  contents: read
  # id-token: write   # real: GCP Workload Identity Federation
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # under Kargo's 30m wait
    env:  # inputs via env, never inline in run: (script injection)
      SYSTEM: ${{ inputs.system }}
      APP: ${{ inputs.app }}
      STAGE: ${{ inputs.stage }}
      TARGET: ${{ inputs.target }}
      COMMIT: ${{ inputs.commit }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: check image matches the branch
        run: |
          cat service.yaml
          got="$(yq '.spec.template.spec.containers[0].image' service.yaml)"
          if [[ "$got" != "$IMAGE" ]]; then
            echo "::error file=service.yaml::image $got != dispatched $IMAGE"; exit 1
          fi
      # real (not applied yet, ADR 0024):
      # - uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: projects/<n>/locations/global/workloadIdentityPools/github/providers/github
      #     service_account: <auth.wifEmail of the target>
      # - run: gcloud run services replace service.yaml --region <region>  # region: run.googleapis.com/location annotation
      - name: summary
        run: |
          {
            echo "### $SYSTEM/$APP → $TARGET"
            echo "| stage | target | commit | image |"
            echo "|---|---|---|---|"
            echo "| $STAGE | $TARGET | \`$COMMIT\` | \`$IMAGE\` |"
            echo
            echo '```yaml'
            cat service.yaml
            echo '```'
            echo
            echo "_demo: not applied yet (ADR 0024)_"
          } >> "$GITHUB_STEP_SUMMARY"
