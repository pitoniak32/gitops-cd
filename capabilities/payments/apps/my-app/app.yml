image: ghcr.io/pitoniak32/nginx
sourceRepo: pitoniak32/gitops-cd
imageConstraint: ^1
port: 80
replicas: 1
env:
  APP_ENV: 'true'
  APP_SECRET: 'secret:acme-proj1/my-app-secret'
  NEW_VAR: 'testing'
stages:
  dev:
    envFrom: [launchdarkly]
    env:
      STAGE_ENV: 'false'
    replicas: 1
    targets:
      us-east4-dev-k8s: {}
      dc1-dev-k8s:
        env:
          APP_ENV: 'false'
        replicas: 3
  staging:
    targets:
      us-east4-npr-k8s:
        replicas: 3
      dc1-npr-k8s:
        env:
          APP_SECRET: 'secret:acme-proj2/my-app-secret@3'
  perf:
    targets:
      us-east4-npr-k8s-perf:
        env:
          DIFFERENT_SECRET: '/test@3'
  prod:
    resources:
      cpu: 500m
      memory: 512Mi
    targets:
      us-east4-prd-k8s: {}
      dc1-prd-k8s: {}
