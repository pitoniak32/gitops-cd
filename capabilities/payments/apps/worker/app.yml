# yaml-language-server: $schema=../../../../platform/render/schemas/app.json
# no perf stage: prod depends on staging only
image: ghcr.io/pitoniak32/nginx
stages:
  dev:
    deployWith: gha  # dev deploys via GitHub Actions (.github/workflows/deploy.yaml); staging, prod via Argo CD
    targets:
      us-dev: {}
  staging:
    targets:
      us-stg: {}
  prod:
    replicas: 3
    targets:
      us-prod: {}
