api:
  host: kargo.localhost
  adminAccount:
    enabled: false
  secretManagementEnabled: false
  oidc:
    enabled: true
    # local keycloak (platform/keycloak.yaml); http so kargo-api needn't trust a self-signed CA
    issuerURL: http://keycloak.localhost/realms/kargo
    clientID: kargo
    dex:
      enabled: false
    # openid/profile/email always requested; chart default `groups` scope doesn't exist in keycloak realm
    additionalScopes: []
    admins:
      claims:
        email:
          - doug@example.com
    viewers:
      claims:
        email:
          - alice@example.com
          - bob@example.com
