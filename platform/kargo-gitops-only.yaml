# Backstop: kargo-api (acts on behalf of every UI/CLI user) may only create
# Promotions and touch metadata/status (refresh, abort, freight approval/alias).
# All other creates/edits/deletes must come via gitops, regardless of user RBAC.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kargo-gitops-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kargo.akuity.io, argoproj.io]
        apiVersions: ["*"]
        resources: ["*"]
        operations: [CREATE, UPDATE, DELETE]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        resources: [roles, rolebindings]
        operations: [CREATE, UPDATE, DELETE]
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: [secrets, configmaps, serviceaccounts, namespaces]
        operations: [CREATE, UPDATE, DELETE]
  matchConditions:
    - name: kargo-api-only
      expression: request.userInfo.username == 'system:serviceaccount:kargo:kargo-api'
  validations:
    - expression: request.operation != 'DELETE'
      message: deletes only via gitops
    - expression: >-
        request.operation != 'CREATE' ||
        (request.resource.group == 'kargo.akuity.io' && request.resource.resource == 'promotions')
      message: only Promotions may be created via kargo UI/API; everything else via gitops
    - expression: >-
        request.operation != 'UPDATE' ||
        (request.resource.group == 'kargo.akuity.io' &&
         (!has(object.spec) || object.spec == oldObject.spec))
      message: spec changes only via gitops
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kargo-gitops-only
spec:
  policyName: kargo-gitops-only
  validationActions: [Deny]
