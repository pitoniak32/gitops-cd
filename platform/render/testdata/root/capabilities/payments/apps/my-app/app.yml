image: ghcr.io/pitoniak32/nginx
imageConstraint: ^1
port: 80
replicas: 2
env:
  APP_ENV: 'true'
  APP_SECRET: 'secret:acme-proj1/my-app-secret'
stages:
  dev:
    envFrom: [launchdarkly]
    env:
      STAGE_ENV: 'false'
    replicas: 1
    targets:
      us-east4-dev-k8s: {}
      dc1-dev-k8s:
        env:
          APP_ENV: 'false'
        replicas: 3
  staging:
    targets:
      us-east4-npr-k8s: {}
      dc1-npr-k8s:
        env:
          APP_SECRET: 'secret:acme-proj2/my-app-secret@3'
        deployWith: gha
        workflow:
          repo: acme/deploys
          file: onprem.yml
          ref: v1
  perf:
    targets:
      us-east4-npr-k8s-perf: {}
  prod:
    resources:
      cpu: 500m
      memory: 512Mi
    targets:
      us-east4-prd-k8s: {}
      dc1-prd-k8s: {}
