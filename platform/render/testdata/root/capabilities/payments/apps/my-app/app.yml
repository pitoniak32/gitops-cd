image: ghcr.io/pitoniak32/nginx
imageConstraint: ^1
port: 80
replicas: 2
env:
  APP_ENV: 'true'
  APP_SECRET: 'secret:acme-proj1/my-app-secret'
stages:
  dev:
    envFrom: [launchdarkly]
    env:
      STAGE_ENV: 'false'
    replicas: 1
    targets:
      us-dev: {}
      onprem-dev:
        env:
          APP_ENV: 'false'
        replicas: 3
  staging:
    targets:
      us-stg: {}
      onprem-stg:
        env:
          APP_SECRET: 'secret:acme-proj2/my-app-secret@3'
  perf:
    targets:
      us-perf: {}
  prod:
    resources:
      cpu: 500m
      memory: 512Mi
    targets:
      us-prod: {}
      onprem-prod: {}
