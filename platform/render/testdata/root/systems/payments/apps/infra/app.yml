module: ghcr.io/pitoniak32/tf-bucket
sourceRepo: pitoniak32/gitops-cd
moduleConstraint: ^1
env:
  TF_VAR_region: us-central1
workflow:
  ref: v1
stages:
  dev:
    targets:
      us-east4-dev-tf:
        envFrom: [bucket]
  prod:
    targets:
      us-east4-prd-tf:
        env:
          TF_VAR_region: us-east1
