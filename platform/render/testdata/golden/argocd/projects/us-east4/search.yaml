apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: search
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: search-us-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: viewer-api
      description: read-only view of search/api for its promoters and viewers
      policies:
        - p, proj:search:viewer-api, applications, get, search/search-api-us-east4-dev-k8s, allow
      groups:
        - alice@example.com
