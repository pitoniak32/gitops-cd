apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: payments-onprem-dev
    - name: in-cluster
      namespace: payments-onprem-prod
    - name: in-cluster
      namespace: payments-onprem-stg
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: viewer
      description: read-only view of payments apps for its promoters and viewers
      policies:
        - p, proj:payments:viewer, applications, get, payments/*, allow
      groups:
        - alice@example.com
        - bob@example.com
        - carol@example.com
        - doug@example.com
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-my-app-onprem-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-payments:my-app-onprem-dev
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/stage: dev
    example.com/target: onprem-dev
spec:
  project: payments
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/payments/my-app/onprem-dev
    path: .
  destination:
    name: in-cluster
    namespace: payments-onprem-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-my-app-onprem-stg
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-payments:my-app-onprem-stg
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/stage: staging
    example.com/target: onprem-stg
spec:
  project: payments
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/payments/my-app/onprem-stg
    path: .
  destination:
    name: in-cluster
    namespace: payments-onprem-stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-my-app-onprem-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-payments:my-app-onprem-prod
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/stage: prod
    example.com/target: onprem-prod
spec:
  project: payments
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/payments/my-app/onprem-prod
    path: .
  destination:
    name: in-cluster
    namespace: payments-onprem-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
