apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: search
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: search-gcp-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: viewer
      description: read-only view of search apps for its promoters and viewers
      policies:
        - p, proj:search:viewer, applications, get, search/*, allow
      groups:
        - alice@example.com
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-api-gcp-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-search:api-dev
  labels:
    example.com/capability: search
    example.com/app: api
    example.com/stage: dev
    example.com/target: gcp-dev
spec:
  project: search
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/search/api/dev
    path: gcp-dev
  destination:
    name: in-cluster
    namespace: search-gcp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
