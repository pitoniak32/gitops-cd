apiVersion: v1
kind: Namespace
metadata:
  name: kargo-payments
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-payments
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-payments
  namespace: kargo-payments
spec:
  promotionPolicies:
    - stageSelector:
        name: infra-tf-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-dev-done
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-onprem-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-prod
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-staging
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-us-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: payments-us-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: worker-us-dev
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: infra
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/payments/infra/
    - image:
        constraint: ^1
        repoURL: ghcr.io/pitoniak32/tf-bucket
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: my-app
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/payments/my-app/
    - image:
        constraint: ^1
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: payments
  namespace: kargo-payments
