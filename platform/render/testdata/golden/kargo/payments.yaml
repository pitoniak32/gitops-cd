apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: us-east4-prd-tf
  namespace: kargo-payments-infra
  labels:
    example.com/system: payments
    example.com/app: infra
    example.com/kind: target
    example.com/stage: prod
    example.com/target: us-east4-prd-tf
    example.com/deploy-with: gha
    example.com/platform: terraform
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
    kargo.akuity.io/color: violet
    example.com/pre-deploy: pitoniak32/gitops-cd/precheck.yaml@main
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: infra
      sources:
        stages:
          - us-east4-dev-tf
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/infra/prod/us-east4-prd-tf/
        - name: branch
          value: env/payments/infra/us-east4-prd-tf
        - name: image
          value: ghcr.io/pitoniak32/tf-bucket
        - name: system
          value: payments
        - name: app
          value: infra
        - name: stage
          value: prod
        - name: target
          value: us-east4-prd-tf
        - name: pinFile
          value: ./out/terraform.yaml
        - name: pinKey
          value: module
        - name: artifactKey
          value: module
        - name: workflowRepo
          value: pitoniak32/gitops-cd
        - name: workflowFile
          value: terraform.yaml
        - name: workflowRef
          value: v1
      steps:
        - as: pre-1
          task:
            kind: ClusterPromotionTask
            name: gha-check
          vars:
            - name: workflowRepo
              value: pitoniak32/gitops-cd
            - name: workflowFile
              value: precheck.yaml
            - name: workflowRef
              value: main
            - name: checkTimeout
              value: 30m
        - as: promote
          task:
            kind: ClusterPromotionTask
            name: promote-gha
