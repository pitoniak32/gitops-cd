apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-us-east4-dev
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: target
    example.com/stage: dev
    example.com/target: us-east4-dev
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        stages:
          - my-app-dev
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/my-app/dev/us-east4-dev/
        - name: branch
          value: env/payments/my-app/us-east4-dev
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote payments/my-app to dev/us-east4-dev from ${{ commitFrom(vars.repo).ID }}
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: payments-my-app-us-east4-dev
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
---
