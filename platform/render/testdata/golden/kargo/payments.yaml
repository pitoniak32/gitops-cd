apiVersion: v1
kind: Namespace
metadata:
  name: kargo-payments
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-payments
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-payments
  namespace: kargo-payments
spec:
  promotionPolicies:
    - stageSelector:
        name: my-app-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-us-east4-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-on-prem-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: payments-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: payments-us-east4-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: worker-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: worker-us-east4-dev
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: my-app
  namespace: kargo-payments
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/my-app/
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: payments
  namespace: kargo-payments
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/payments/
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: worker
  namespace: kargo-payments
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/worker/
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-dev
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: gate
    example.com/stage: dev
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        direct: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-staging
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: gate
    example.com/stage: staging
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        stages:
          - my-app-on-prem-dev
          - my-app-us-east4-dev
        availabilityStrategy: All
---
apiVersion: kargo.akuity.io/v1alpha1
