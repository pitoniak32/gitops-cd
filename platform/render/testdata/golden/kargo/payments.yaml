---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-payments-flagged
  namespace: kargo-payments-flagged
spec:
  promotionPolicies:
    - stageSelector:
        name: us-east4-dev-k8s
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: flagged
  namespace: kargo-payments-flagged
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/payments/flagged/
    - image:
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: us-east4-dev-k8s
  namespace: kargo-payments-flagged
  labels:
    example.com/system: payments
    example.com/app: flagged
    example.com/kind: target
    example.com/stage: dev
    example.com/target: us-east4-dev-k8s
    example.com/deploy-with: gha
    example.com/platform: k8s
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
    kargo.akuity.io/color: blue
spec:
  shard: us-east4
  requestedFreight:
    - origin:
        kind: Warehouse
        name: flagged
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/flagged/dev/us-east4-dev-k8s/
        - name: branch
          value: env/payments/flagged/us-east4-dev-k8s
        - name: image
          value: ghcr.io/pitoniak32/nginx
        - name: system
          value: payments
        - name: app
          value: flagged
        - name: stage
          value: dev
        - name: target
          value: us-east4-dev-k8s
        - name: pinFile
          value: ./out/deployment.yaml
        - name: pinKey
          value: spec.template.spec.containers.0.image
        - name: artifactKey
          value: image
        - name: workflowRepo
          value: pitoniak32/deploys
        - name: workflowFile
          value: deploy-dev.yml
        - name: workflowRef
          value: v2
      steps:
        - as: promote
          task:
            kind: ClusterPromotionTask
            name: promote-gha
