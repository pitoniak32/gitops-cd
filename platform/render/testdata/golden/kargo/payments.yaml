apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: worker-us-dev
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: worker
    example.com/kind: target
    example.com/stage: dev
    example.com/target: us-dev
    example.com/deploy-with: gha
    example.com/platform: k8s
  annotations:
    example.com/break-glass: '["carol@example.com"]'
    kargo.akuity.io/color: blue
spec:
  shard: us
  requestedFreight:
    - origin:
        kind: Warehouse
        name: worker
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/worker/dev/us-dev/
        - name: branch
          value: env/payments/worker/us-dev
        - name: image
          value: ghcr.io/pitoniak32/nginx
        - name: workflowRepo
          value: pitoniak32/gitops-cd
        - name: workflowFile
          value: deploy.yaml
        - name: workflowRef
          value: main
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: yaml-update
          config:
            path: ./out/deployment.yaml
            updates:
              - key: spec.template.spec.containers.0.image
                value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}@${{ imageFrom(vars.image).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote payments/worker to dev/us-dev from ${{ commitFrom(vars.repo).ID }}, image ${{ imageFrom(vars.image).Tag }}
        - uses: git-push
          config:
            path: ./out
        - uses: http
          as: dispatch
          config:
            method: POST
            url: https://api.github.com/repos/${{ vars.workflowRepo }}/actions/workflows/${{ vars.workflowFile }}/dispatches
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('github-actions').token }}
              - name: Accept
                value: application/vnd.github+json
              - name: X-GitHub-Api-Version
                value: "2022-11-28"
              - name: Content-Type
                value: application/json
            body: '${{ quote({''ref'': vars.workflowRef, ''return_run_details'': true, ''inputs'': {''capability'': ''payments'', ''app'': ''worker'', ''stage'': ''dev'', ''target'': ''us-dev'', ''commit'': outputs.commit.commit, ''image'': vars.image + '':'' + imageFrom(vars.image).Tag + ''@'' + imageFrom(vars.image).Digest} }) }}'
            successExpression: response.status == 200
            failureExpression: response.status != 200
            errorExpression: response.body.message
            outputs:
              - name: runID
                fromExpression: response.body.workflow_run_id
              - name: runURL
                fromExpression: response.body.html_url
        - uses: http
          as: wait
          retry:
            timeout: 30m
          config:
            method: GET
            url: https://api.github.com/repos/${{ vars.workflowRepo }}/actions/runs/${{ outputs.dispatch.runID }}
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('github-actions').token }}
              - name: Accept
                value: application/vnd.github+json
              - name: X-GitHub-Api-Version
                value: "2022-11-28"
            successExpression: response.status == 200 && response.body.status == 'completed' && response.body.conclusion == 'success'
            failureExpression: response.status != 200 || (response.body.status == 'completed' && response.body.conclusion != 'success')
            errorExpression: 'response.status != 200 ? response.body.message : ''run '' + string(response.body.id) + '' '' + response.body.conclusion + '': '' + response.body.html_url'
---
