apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-staging@team1-staging.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: payments
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: us-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: payments
  namespace: payments-us-stg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: payments
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: us-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: payments
  namespace: payments-us-stg
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: payments
        example.com/capability: payments
        example.com/stage: staging
        example.com/target: us-stg
        example.com/environment: staging
        example.com/billing: nonprod
    spec:
      containers:
        - image: ghcr.io/pitoniak32/nginx@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
          name: payments
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: payments
