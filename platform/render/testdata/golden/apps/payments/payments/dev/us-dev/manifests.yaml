apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-dev@team1-dev.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: payments
    example.com/capability: payments
    example.com/stage: dev
    example.com/target: us-dev
    example.com/environment: dev
    example.com/billing: dev
  name: payments
  namespace: payments-us-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: payments
    example.com/capability: payments
    example.com/stage: dev
    example.com/target: us-dev
    example.com/environment: dev
    example.com/billing: dev
  name: payments
  namespace: payments-us-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: payments
        example.com/capability: payments
        example.com/stage: dev
        example.com/target: us-dev
        example.com/environment: dev
        example.com/billing: dev
    spec:
      containers:
        - image: ghcr.io/pitoniak32/nginx
          name: payments
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: payments
