apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: flagged
    example.com/system: payments
    example.com/stage: dev
    example.com/target: us-east4-dev-k8s
    example.com/environment: dev
    example.com/environment-type: dev
    example.com/billing: dev
  name: flagged
  namespace: payments-us-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flagged
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: flagged
        example.com/system: payments
        example.com/stage: dev
        example.com/target: us-east4-dev-k8s
        example.com/environment: dev
        example.com/environment-type: dev
        example.com/billing: dev
    spec:
      containers:
        - env:
            - name: LD_RELAY_URL
              value: https://ld-relay.us-dev.example.com
            - name: APP_ENV
              value: from-bundle
          image: ghcr.io/pitoniak32/nginx
          name: flagged
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: flagged
