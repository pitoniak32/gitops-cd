apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: dev
    example.com/target: onprem-dev
    example.com/environment: dev
    example.com/billing: dev
  name: my-app
  namespace: payments-onprem-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/capability: payments
        example.com/stage: dev
        example.com/target: onprem-dev
        example.com/environment: dev
        example.com/billing: dev
    spec:
      containers:
        - env:
            - name: LD_RELAY_URL
              value: https://ld-relay.onprem-dev.example.com
            - name: STAGE_ENV
              value: "false"
            - name: APP_ENV
              value: "false"
          image: ghcr.io/pitoniak32/nginx
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: my-app
