apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-dev@team1-dev.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: dev
    example.com/target: on-prem-dev
    example.com/environment: dev
    example.com/billing: dev
  name: my-app
  namespace: payments-on-prem-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: dev
    example.com/target: on-prem-dev
    example.com/environment: dev
    example.com/billing: dev
  name: my-app
  namespace: payments-on-prem-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/capability: payments
        example.com/stage: dev
        example.com/target: on-prem-dev
        example.com/environment: dev
        example.com/billing: dev
    spec:
      containers:
        - env:
            - name: LD_RELAY_URL
              value: https://ld-relay.on-prem-dev.example.com
            - name: STAGE_ENV
              value: "false"
            - name: APP_ENV
              value: "false"
          image: ghcr.io/pitoniak32/nginx@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: my-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: dev
    example.com/target: on-prem-dev
    example.com/environment: dev
    example.com/billing: dev
  name: my-app
  namespace: payments-on-prem-dev
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: my-app
