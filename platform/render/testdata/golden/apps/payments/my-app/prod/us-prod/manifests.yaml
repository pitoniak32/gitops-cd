apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-prod@team1-prod.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: prod
    example.com/target: us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: my-app
  namespace: payments-us-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: prod
    example.com/target: us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: my-app
  namespace: payments-us-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/capability: payments
        example.com/stage: prod
        example.com/target: us-prod
        example.com/environment: prod
        example.com/billing: prod
    spec:
      containers:
        - env:
            - name: APP_ENV
              value: "true"
          image: ghcr.io/pitoniak32/nginx
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 512Mi
      serviceAccountName: my-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: prod
    example.com/target: us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: my-app
  namespace: payments-us-prod
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: my-app
