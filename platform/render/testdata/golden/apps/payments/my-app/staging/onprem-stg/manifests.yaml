apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-staging@team1-staging.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: onprem-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: my-app
  namespace: payments-onprem-stg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: onprem-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: my-app
  namespace: payments-onprem-stg
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/capability: payments
        example.com/stage: staging
        example.com/target: onprem-stg
        example.com/environment: staging
        example.com/billing: nonprod
    spec:
      containers:
        - env:
            - name: APP_ENV
              value: "true"
          image: ghcr.io/pitoniak32/nginx
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: my-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: onprem-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: my-app
  namespace: payments-onprem-stg
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: my-app
