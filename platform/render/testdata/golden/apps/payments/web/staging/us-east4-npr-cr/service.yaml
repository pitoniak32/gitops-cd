apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web
  namespace: acme-payments-npr
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: cue-platform
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: us-east4-npr-cr
    example.com/environment: staging
    example.com/environment-type: npr
    example.com/billing: payments
  annotations:
    run.googleapis.com/location: us-east4
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/managed-by: cue-platform
        example.com/capability: payments
        example.com/stage: staging
        example.com/target: us-east4-npr-cr
        example.com/environment: staging
        example.com/environment-type: npr
        example.com/billing: payments
      annotations:
        autoscaling.knative.dev/minScale: "0"
    spec:
      containers:
        - name: web
          image: ghcr.io/example/web
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: projects/acme-secrets/secrets/web-api-key
                  key: latest
            - name: GREETING
              value: hello
