apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: dev
    example.com/target: us-dev
    example.com/environment: dev
    example.com/environment-type: dev
    example.com/billing: dev
  name: api
  namespace: search-us-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: api
        example.com/capability: search
        example.com/stage: dev
        example.com/target: us-dev
        example.com/environment: dev
        example.com/environment-type: dev
        example.com/billing: dev
    spec:
      containers:
        - image: ghcr.io/pitoniak32/nginx
          name: api
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: api
