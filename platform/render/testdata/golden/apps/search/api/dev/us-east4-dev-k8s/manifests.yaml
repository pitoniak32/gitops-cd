apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: search-dev@search-dev.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/system: search
    example.com/stage: dev
    example.com/target: us-east4-dev-k8s
    example.com/environment: dev
    example.com/environment-type: dev
    example.com/billing: dev
  name: api
  namespace: search-us-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/system: search
    example.com/stage: dev
    example.com/target: us-east4-dev-k8s
    example.com/environment: dev
    example.com/environment-type: dev
    example.com/billing: dev
  name: api
  namespace: search-us-dev
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: api
