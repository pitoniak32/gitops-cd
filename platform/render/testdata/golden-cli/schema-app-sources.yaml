# app: capabilities/{cap}/apps/*/app.yml — an app: what it ships and its settings at app, stage and target level
replicas: <int>                 # number of replicas, 0 to 100 (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:5)
env:                            # environment variables, KEY: value; a value may be secret:<gcp-project>/<secret>[@<version>]; merged per key (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:4)
  <KEY>: <str>                  # (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:5)
envFrom:                        # names of the target's environment-variables files to include (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:4)
  - <str>                       # /^[a-z][a-z0-9-]{0,39}$/ (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:4)
resources:                      # container resource requests (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:5)
  cpu: <str>                    # /^[0-9]+m?$/ — CPU, whole cores or millicores (100m) (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:6)
  memory: <str>                 # /^[0-9]+(Mi|Gi)$/ — memory in Mi or Gi (128Mi) (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:7)
deployWith: argocd|gha          # argocd (default) syncs the target's Argo CD app; gha dispatches a GitHub Actions workflow (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:8)
workflow:                       # GitHub Actions workflow dispatched when deployWith is gha (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:9)
  repo: <str>                   # /^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$/ — workflow repository, <owner>/<name> (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:10)
  file: <str>                   # /^[A-Za-z0-9_.-]+\.ya?ml$/ — workflow file name, .yml or .yaml (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:11)
  ref: <str>                    # /./ — git ref the workflow runs on (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:7)
image: <str>                    # /^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$/ — container image repository, no tag or digest (K8s and Cloud Run apps; set this or module) (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:2)
imageConstraint: <str>          # /./ — SemVer constraint for the image tags to deploy (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:3)
module: <str>                   # /^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$/ — terraform module OCI repository, no tag or digest (terraform apps; set this or image) (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:1)
moduleConstraint: <str>         # /./ — SemVer constraint for the module versions to deploy (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:3)
port: <int>                     # container port, 1 to 65535 (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:4)
sourceRepo: <str>               # required; /^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$/ — GitHub repository of the app's code, <owner>/<name>; pre-deploy checks run there (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:3)
stages:                         # stages the app deploys through, by stage name, each with its targets (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:12)
  <stage>:                      # (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:13)
    replicas: <int>             # number of replicas, 0 to 100 (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:14)
    env:                        # environment variables, KEY: value; a value may be secret:<gcp-project>/<secret>[@<version>]; merged per key (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:12)
      <KEY>: <str>              # (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:13)
    envFrom:                    # names of the target's environment-variables files to include (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:11)
      - <str>                   # /^[a-z][a-z0-9-]{0,39}$/ (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:11)
    resources:                  # container resource requests (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:39)
      cpu: <str>                # /^[0-9]+m?$/ — CPU, whole cores or millicores (100m) (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:40)
      memory: <str>             # /^[0-9]+(Mi|Gi)$/ — memory in Mi or Gi (128Mi) (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:41)
    deployWith: argocd|gha      # argocd (default) syncs the target's Argo CD app; gha dispatches a GitHub Actions workflow (e.g. platform/render/testdata/root/capabilities/payments/apps/worker/app.yml:8)
    workflow:                   # GitHub Actions workflow dispatched when deployWith is gha (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:14)
      repo: <str>               # /^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$/ — workflow repository, <owner>/<name> (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:15)
      file: <str>               # /^[A-Za-z0-9_.-]+\.ya?ml$/ — workflow file name, .yml or .yaml (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:16)
      ref: <str>                # /./ — git ref the workflow runs on (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:17)
    targets:                    # targets this stage deploys to, by target name; settings here override the stage's and app's (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:18)
      <target>:                 # (e.g. platform/render/testdata/root/capabilities/payments/apps/flagged/app.yml:19)
        replicas: <int>         # number of replicas, 0 to 100 (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:20)
        env:                    # environment variables, KEY: value; a value may be secret:<gcp-project>/<secret>[@<version>]; merged per key (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:16)
          <KEY>: <str>          # (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:17)
        envFrom:                # names of the target's environment-variables files to include (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:12)
          - <str>               # /^[a-z][a-z0-9-]{0,39}$/ (e.g. platform/render/testdata/root/capabilities/payments/apps/infra/app.yml:12)
        resources:              # container resource requests (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:21)
          cpu: <str>            # /^[0-9]+m?$/ — CPU, whole cores or millicores (100m) (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:22)
          memory: <str>         # /^[0-9]+(Mi|Gi)$/ — memory in Mi or Gi (128Mi) (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:23)
        deployWith: argocd|gha  # argocd (default) syncs the target's Argo CD app; gha dispatches a GitHub Actions workflow (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:30)
        workflow:               # GitHub Actions workflow dispatched when deployWith is gha (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:31)
          repo: <str>           # /^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$/ — workflow repository, <owner>/<name> (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:32)
          file: <str>           # /^[A-Za-z0-9_.-]+\.ya?ml$/ — workflow file name, .yml or .yaml (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:33)
          ref: <str>            # /./ — git ref the workflow runs on (e.g. platform/render/testdata/root/capabilities/payments/apps/my-app/app.yml:34)
