flagged:
  owners:
    codeOwners: [team1]
    promoters:
      dev: [doug@example.com]
    viewers: [bob@example.com]
    breakGlass: [carol@example.com]
  dev:
    us-east4-dev-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: dev
      environmentType: dev
      platform: K8S
      cluster: us-east4
      namespace: payments-us-dev
      billing: dev
      auth:
        wifEmail: team1-dev@team1-dev.iam.gserviceaccount.com
      replicas: 2
      resources:
        cpu: 100m
        memory: 128Mi
      deployWith: gha
      workflow:
        repo: pitoniak32/deploys
        file: deploy-dev.yml
        ref: v2
      envFrom:
        - launchdarkly
      env:
        LD_SDK_KEY: secret:acme-dev-us/launchdarkly-sdk-key
        LD_RELAY_URL: https://ld-relay.us-dev.example.com
        APP_ENV: from-bundle
infra:
  owners:
    codeOwners: [team1]
    promoters:
      dev: [doug@example.com]
      prod: [doug@example.com]
    viewers: [bob@example.com]
    breakGlass: [carol@example.com]
  dev:
    us-east4-dev-tf:
      module: ghcr.io/pitoniak32/tf-bucket
      environment: dev
      environmentType: dev
      platform: TERRAFORM
      region: us-east4
      gcpProject: team1-dev
      billing: dev
      auth:
        wifEmail: team1-dev@team1-dev.iam.gserviceaccount.com
      backend:
        bucket: tfstate-team1-dev
      deployWith: gha
      workflow:
        repo: pitoniak32/gitops-cd
        file: terraform.yaml
        ref: v1
      envFrom:
        - bucket
      env:
        TF_VAR_bucket_name: payments-dev
        TF_VAR_region: us-central1
  prod:
    us-east4-prd-tf:
      module: ghcr.io/pitoniak32/tf-bucket
      environment: prod
      environmentType: prd
      platform: TERRAFORM
      region: us-east4
      gcpProject: team1-prod
      billing: prod
      auth:
        wifEmail: team1-prod@team1-prod.iam.gserviceaccount.com
      backend:
        bucket: tfstate-team1-prod
        prefix: payments/custom
      deployWith: gha
      workflow:
        repo: pitoniak32/gitops-cd
        file: terraform.yaml
        ref: v1
      env:
        TF_VAR_region: us-east1
my-app:
  owners:
    codeOwners: [team1]
    promoters:
      dev: [doug@example.com]
      staging: [doug@example.com]
      perf: [doug@example.com]
      prod: [doug@example.com]
    viewers: [bob@example.com]
    breakGlass: [carol@example.com]
  dev:
    dc1-dev-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: dev
      environmentType: dev
      platform: K8S
      cluster: dc1
      namespace: payments-onprem-dev
      billing: dev
      auth:
        wifEmail: team1-dev@team1-dev.iam.gserviceaccount.com
      port: 80
      replicas: 3
      resources:
        cpu: 250m
        memory: 256Mi
      deployWith: argocd
      envFrom:
        - launchdarkly
      env:
        LD_SDK_KEY: secret:acme-dev-onprem/launchdarkly-sdk-key
        LD_RELAY_URL: https://ld-relay.onprem-dev.example.com
        APP_SECRET: secret:acme-proj1/my-app-secret
        STAGE_ENV: "false"
        APP_ENV: "false"
    us-east4-dev-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: dev
      environmentType: dev
      platform: K8S
      cluster: us-east4
      namespace: payments-us-dev
      billing: dev
      auth:
        wifEmail: team1-dev@team1-dev.iam.gserviceaccount.com
      port: 80
      replicas: 1
      resources:
        cpu: 100m
        memory: 128Mi
      deployWith: argocd
      envFrom:
        - launchdarkly
      env:
        LD_SDK_KEY: secret:acme-dev-us/launchdarkly-sdk-key
        LD_RELAY_URL: https://ld-relay.us-dev.example.com
        APP_ENV: "true"
        APP_SECRET: secret:acme-proj1/my-app-secret
        STAGE_ENV: "false"
  staging:
    dc1-npr-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: staging
      environmentType: npr
      platform: K8S
      cluster: dc1
      namespace: payments-onprem-stg
      billing: nonprod
      auth:
        wifEmail: team1-staging@team1-staging.iam.gserviceaccount.com
      port: 80
      replicas: 2
      resources:
        cpu: 100m
        memory: 128Mi
      deployWith: gha
      workflow:
        repo: acme/deploys
        file: onprem.yml
        ref: v1
      env:
        APP_ENV: "true"
        APP_SECRET: secret:acme-proj2/my-app-secret@3
    us-east4-npr-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: staging
      environmentType: npr
      platform: K8S
      cluster: us-east4
      namespace: payments-us-stg
      billing: nonprod
      auth:
        wifEmail: team1-staging@team1-staging.iam.gserviceaccount.com
      port: 80
      replicas: 2
      resources:
        cpu: 100m
        memory: 128Mi
      deployWith: argocd
      env:
        APP_ENV: "true"
        APP_SECRET: secret:acme-proj1/my-app-secret
  perf:
    us-east4-npr-k8s-perf:
      image: ghcr.io/pitoniak32/nginx
      environment: perf
      environmentType: npr
      platform: K8S
      cluster: us-east4
      namespace: payments-us-perf
      billing: nonprod
      auth:
        wifEmail: team1-perf@team1-perf.iam.gserviceaccount.com
      port: 80
      replicas: 2
      resources:
        cpu: 100m
        memory: 128Mi
      deployWith: argocd
      env:
        APP_ENV: "true"
        APP_SECRET: secret:acme-proj1/my-app-secret
  prod:
    dc1-prd-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: prod
      environmentType: prd
      platform: K8S
      cluster: dc1
      namespace: payments-onprem-prod
      billing: prod
      auth:
        wifEmail: team1-prod@team1-prod.iam.gserviceaccount.com
      port: 80
      replicas: 2
      resources:
        cpu: 500m
        memory: 512Mi
      deployWith: argocd
      env:
        APP_ENV: "true"
        APP_SECRET: secret:acme-proj1/my-app-secret
    us-east4-prd-k8s:
      image: ghcr.io/pitoniak32/nginx
      environment: prod
      environmentType: prd
      platform: K8S
      cluster: us-east4
      namespace: payments-us-prod
      billing: prod
      auth:
        wifEmail: team1-prod@team1-prod.iam.gserviceaccount.com
      port: 80
      replicas: 2
      resources:
        cpu: 500m
        memory: 512Mi
      deployWith: argocd
      env:
        APP_ENV: "true"
        APP_SECRET: secret:acme-proj1/my-app-secret
