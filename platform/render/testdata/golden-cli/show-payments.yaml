web:
  owners:
    codeOwners: [team1]
    promoters:
      dev: [doug@example.com]
      staging: [doug@example.com]
    viewers: [bob@example.com]
    breakGlass: [carol@example.com]
  dev:
    us-east4-dev-k8s:
      image: ghcr.io/example/web
      environment: dev
      environmentType: dev
      platform: K8S
      cluster: us-east4
      namespace: payments-us-dev
      billing: dev
      auth:
        wifEmail: team1-dev@team1-dev.iam.gserviceaccount.com
      replicas: 2
      resources:
        cpu: 100m
        memory: 128Mi
      deployWith: argocd
      env:
        GREETING: hello
        API_KEY: secret:acme-secrets/web-api-key
        DB_PASS: secret:acme-payments-npr/db_pass@3
  staging:
    us-east4-npr-cr:
      image: ghcr.io/example/web
      environment: staging
      environmentType: npr
      platform: CLOUD_RUN
      region: us-east4
      gcpProject: acme-payments-npr
      billing: payments
      auth:
        wifEmail: deployer@acme-payments-npr.iam.gserviceaccount.com
      port: 8080
      replicas: 0
      resources:
        cpu: "1"
        memory: 512Mi
      deployWith: gha
      workflow:
        repo: pitoniak32/gitops-cd
        file: cloud-run.yaml
        ref: main
      env:
        GREETING: hello
        API_KEY: secret:acme-secrets/web-api-key
        DB_PASS: secret:acme-payments-npr/db_pass@3
