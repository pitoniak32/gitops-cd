# hub only: Application rendered-kargo syncs rendered/kargo/<cap>.yaml (a Kargo Project per app, Warehouses, Stages,
# promote RBAC) from the rendered branch (ADR 0002)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rendered-kargo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            example.com/role: hub
  template:
    metadata:
      name: rendered-kargo
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/pitoniak32/gitops-cd
        targetRevision: rendered
        path: rendered/kargo
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # backstop: Kargo must adopt each rendered project namespace before its resources apply cleanly
        retry:
          limit: 10
          backoff: {duration: 5s, factor: 2, maxDuration: 1m}
