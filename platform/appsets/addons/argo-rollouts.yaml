# hub add-on argo-rollouts
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true  # deleting this AppSet must not take the add-on with it
  generators:
    - clusters:
        selector:
          matchLabels:
            example.com/role: hub
  template:
    metadata:
      name: argo-rollouts
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: https://argoproj.github.io/argo-helm
          chart: argo-rollouts
          targetRevision: 2.43.9
          helm:
            releaseName: argo-rollouts
      destination:
        server: https://kubernetes.default.svc
        namespace: argo-rollouts
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRDs/webhooks from other add-ons may not exist yet
        retry:
          limit: -1  # unlimited: add-ons start together, deps (CRDs, webhooks) may take a while
          backoff: {duration: 5s, factor: 2, maxDuration: 1m}
