# hub add-on keycloak: kustomize manifests
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keycloak
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true  # deleting this AppSet must not take the add-on with it
  generators:
    - clusters:
        selector:
          matchLabels:
            example.com/role: hub
  template:
    metadata:
      name: keycloak
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: https://github.com/pitoniak32/gitops-cd
          targetRevision: main
          path: platform/infrastructure/keycloak/manifests
      destination:
        server: https://kubernetes.default.svc
        namespace: keycloak
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRDs/webhooks from other add-ons may not exist yet
        retry:
          limit: 10
          backoff: {duration: 5s, factor: 2, maxDuration: 1m}
