# hub Argo CD manages itself; bootstrapped by `helm install` in mise-tasks/infra. Pin shared with argocd-region
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true  # deleting this AppSet must not take the add-on with it
  generators:
    - clusters:
        selector:
          matchLabels:
            example.com/role: hub
  template:
    metadata:
      name: argocd
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: https://argoproj.github.io/argo-helm
          chart: argo-cd
          targetRevision: 10.14.0
          helm:
            releaseName: argocd
            valueFiles:
              - $values/platform/infrastructure/argocd/values.yaml
        - repoURL: https://github.com/pitoniak32/gitops-cd
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRDs/webhooks from other add-ons may not exist yet
        retry:
          limit: 10
          backoff: {duration: 5s, factor: 2, maxDuration: 1m}
