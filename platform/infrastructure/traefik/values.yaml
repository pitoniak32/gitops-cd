service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
# browser-trusted cert for *.localhost UIs: secret local-tls created by `gcd certs` (local CA, not in git)
tlsStore:
  default:
    defaultCertificate:
      secretName: local-tls
providers:
  kubernetesCRD:
    # regional Argo CD UIs are ExternalName services to the region containers (../argocd-region-hub/)
    allowExternalNameServices: true
# traces -> the hub's alloy (ADR 0031); metrics: pod port `metrics` (9100) scraped by alloy
tracing:
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: alloy.alloy.svc.cluster.local:4317
      insecure: true
