# used for helm bootstrap AND argocd self-managing Application (keep identical; bootstrap skips extraObjects)
global:
  domain: argocd.localhost
configs:
  params:
    server.insecure: true  # tls terminated by traefik
  repositories:
    kargo-charts:
      type: helm
      name: kargo-charts
      url: ghcr.io/akuity/kargo-charts
      enableOCI: "true"
  cm:
    url: https://argocd.localhost
    # keycloak only; break-glass = kubectl (cluster admin)
    admin.enabled: false
    # local keycloak (infrastructure/keycloak/), public client + PKCE, no secret
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.localhost/realms/kargo
      clientID: argocd
      cliClientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: [openid, profile, email]
  rbac:
    # match policies/AppProject role `groups` against the `email` claim only (ADR 0011)
    scopes: "[email]"
    # teams: only apps of capabilities they own, read-only, via the generated AppProject `viewer`
    # roles (rendered/argocd/<cap>.yaml). Kargo does all syncing.
    # platform admins by email: full admin, incl. infrastructure apps (ADR 0009).
    policy.default: ""
    policy.csv: |
      g, admin@example.com, role:admin
server:
  # Ingress never gets an address with NodePort traefik -> stuck Progressing in argo; use IngressRoute
  ingress:
    enabled: false
dex:
  enabled: false
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server
      namespace: argocd
    spec:
      entryPoints: [websecure]
      routes:
        - match: Host(`argocd.localhost`)
          kind: Rule
          services:
            - name: argocd-server
              port: 80
