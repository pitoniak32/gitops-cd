# Grafana Alloy on every cluster (ADR 0031): AppSets alloy (hub) + alloy-region (regions) set env CLUSTER.
# Scrapes pod ports named metrics/http-metrics + kubelet cAdvisor, tails pod logs, receives OTLP (alloy.alloy.svc
# :4317 grpc / :4318 http), tags everything k8s.cluster.name=$CLUSTER and pushes OTLP/HTTP to the hub store via
# http://otlp.localhost (CoreDNS rewrite to hub traefik; the hub never holds region creds, ADR 0015).
controller:
  type: deployment  # one pod: logs and cAdvisor are read through the API/kubelet, a DaemonSet would duplicate them
  replicas: 1
alloy:
  enableReporting: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  extraPorts:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
  configMap:
    content: |
      logging {
        level = "warn"
      }

      // ---- metrics: pod ports named metrics / http-metrics (Argo CD, Kargo, Traefik, cert-manager, Rollouts)
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_metrics" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "(http-)?metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      prometheus.scrape "pods" {
        targets         = discovery.relabel.pod_metrics.output
        scrape_interval = "30s"
        forward_to      = [otelcol.receiver.prometheus.default.receiver]
      }

      // ---- metrics: kubelet cAdvisor on each node (chart RBAC grants nodes/metrics)
      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "cadvisor" {
        targets           = discovery.relabel.cadvisor.output
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "30s"
        forward_to      = [otelcol.receiver.prometheus.default.receiver]
      }

      otelcol.receiver.prometheus "default" {
        output {
          metrics = [otelcol.processor.transform.cluster.input]
        }
      }

      // ---- logs: every container, through the API (namespace/pod/container: structured metadata in Loki)
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [otelcol.receiver.loki.default.receiver]
      }

      otelcol.receiver.loki "default" {
        output {
          logs = [otelcol.processor.transform.cluster.input]
        }
      }

      // ---- Kargo promotion events -> counter gitops_cd_promotion_events_total + Loki audit log (ADR 0031).
      // Promotions and their events live on the hub (shard controllers write there too); regions drop everything.
      // Kargo Stage name = target name <region>-<environmentType>-<k8s|tf|cr>[-<qualifier>] (lint-enforced, ADR 0025).
      // Restart: the apiserver's ~1h of events is replayed into a fresh counter.
      loki.source.kubernetes_events "kargo" {
        log_format = "json"
        forward_to = [loki.process.promotions.receiver]
      }

      loki.process "promotions" {
        stage.match {
          selector            = "{namespace!~\"kargo-.+\"}"
          action              = "drop"
          drop_counter_reason = "not_kargo_project"
        }
        stage.match {
          selector            = "{namespace=~\"kargo-.+\"} !~ \"\\\"kind\\\":\\\"Promotion\\\"\""
          action              = "drop"
          drop_counter_reason = "not_promotion"
        }
        stage.json {
          expressions = { reason = "", name = "", msg = "" }
        }
        // Promotion name = <Kargo Stage = target>.<ulid>.<freight>
        stage.regex {
          source     = "name"
          expression = "^(?P<target>[^.]+)\\."
        }
        stage.regex {
          source     = "target"
          expression = "^(?P<region>.+)-(?P<environment_type>dev|npr|prd)-(?P<platform>k8s|tf|cr)(?:-[a-z0-9]+)?$"
        }
        // only PromotionCreated names who promoted: ... by "email:<who>"
        stage.regex {
          source     = "msg"
          expression = "by \"(?P<actor>[^\"]+)\"$"
        }
        stage.labels {
          values = { project = "namespace", reason = "", target = "", region = "", environment_type = "", platform = "", actor = "" }
        }
        stage.label_drop {
          values = ["namespace", "job", "instance"]
        }
        stage.metrics {
          metric.counter {
            name              = "promotion_events_total"
            prefix            = "gitops_cd_"
            description       = "Kargo Promotion events (reason PromotionCreated/Succeeded/Failed/Errored/Aborted) by project, target, platform"
            match_all         = true
            action            = "inc"
            max_idle_duration = "720h"
          }
        }
        forward_to = [otelcol.receiver.loki.default.receiver]
      }

      // ---- traces (and any OTLP): Argo CD, Traefik
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.processor.transform.cluster.input]
          logs    = [otelcol.processor.transform.cluster.input]
          traces  = [otelcol.processor.transform.cluster.input]
        }
      }

      // ---- k8s.cluster.name on every signal (Prometheus promotes it to k8s_cluster_name; Loki indexes it)
      otelcol.processor.transform "cluster" {
        error_mode = "ignore"
        metric_statements {
          context    = "resource"
          statements = [`set(attributes["k8s.cluster.name"], "` + sys.env("CLUSTER") + `")`]
        }
        log_statements {
          context    = "resource"
          statements = [`set(attributes["k8s.cluster.name"], "` + sys.env("CLUSTER") + `")`]
        }
        trace_statements {
          context    = "resource"
          statements = [`set(attributes["k8s.cluster.name"], "` + sys.env("CLUSTER") + `")`]
        }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          metrics = [otelcol.exporter.otlphttp.hub.input]
          logs    = [otelcol.exporter.otlphttp.hub.input]
          traces  = [otelcol.exporter.otlphttp.hub.input]
        }
      }

      otelcol.exporter.otlphttp "hub" {
        client {
          endpoint = "http://otlp.localhost"
        }
      }
