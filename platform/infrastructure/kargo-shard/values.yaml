# REGION side of a Kargo controller shard: region-independent values. Region bits (controller id/shardName,
# events Role) are the valuesObject in ../../appsets/addons/kargo-shard.yaml. Only the controller + local
# Argo CD RBAC; everything else is on the hub.
dataPlane:
  install: false
  controller: {install: false}
argocd:
  dataPlane: {install: true}  # local ClusterRole/Binding for Applications
api: {enabled: false}
externalWebhooksServer: {enabled: false}
garbageCollector: {enabled: false}
webhooksServer: {enabled: false}
managementController: {enabled: false}
kubeconfigSecrets:
  kargo: kargo-hub-kubeconfig  # written by `gcd kargo-shards`
controller:
  rollouts: {integrationEnabled: false}
  metrics: {enabled: true}  # port http-metrics, scraped by alloy (ADR 0031)
