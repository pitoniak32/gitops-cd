api:
  host: kargo.localhost
  adminAccount:
    enabled: false
  secretManagementEnabled: false
  oidc:
    enabled: true
    # local keycloak (infrastructure/keycloak/); http so kargo-api needn't trust a self-signed CA
    issuerURL: http://keycloak.localhost/realms/kargo
    clientID: kargo
    dex:
      enabled: false
    # openid/profile/email always requested; all access maps the `email` claim (ADR 0011), no groups
    additionalScopes: []
    # platform admins by email = Kargo admin (ADR 0009): view/promote/approve everywhere;
    # create/edit/delete still blocked for everyone by infrastructure/kargo-config/manifests/gitops-only.yaml
    admins:
      claims:
        email: [admin@example.com]
    # no global viewers/users; all access is generated per system from owners.yml emails
    # (rendered/kargo/<sys>.yaml):
    #   promote-<stage> in kargo-<sys>-<app> (one project per app, ADR 0029): that stage's promoters
    #   viewers in kargo-<sys>-<app>: the app's promoters + viewers get Kargo's kargo-viewer Role (read project)
    #   users-<sys> in kargo-shared-resources: kargo-user (list project names), via the SAs below
    globalServiceAccounts:
      namespaces:
        - kargo-shared-resources
  argocd:
    # shard -> regional Argo CD UI; GENERATED by gcd regions (clusters.cue). Default shard has no Argo CD.
    urls:
      dc1: https://argocd-dc1.localhost
      us-east4: https://argocd-us-east4.localhost
controller:
  metrics: {enabled: true}  # port http-metrics, scraped by alloy (ADR 0031)
