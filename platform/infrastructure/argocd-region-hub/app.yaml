# HUB side of a regional Argo CD UI (one per region, templated: __SHARD__ = region name).
# IngressRoute on the hub traefik (only the hub binds host 443) -> ExternalName service -> the region
# container's argocd-server NodePort on the docker network. Plain HTTP proxying; hub holds no credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ui-__SHARD__
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts
    chart: raw
    targetRevision: 2.0.2
    # helm.valuesObject.resources filled from manifests/ by mise-tasks/infra-render
    helm:
      releaseName: argocd-ui-__SHARD__
      valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 5s, factor: 2, maxDuration: 1m }
