# docker DNS resolves the region container name (stable across restarts, unlike its IP)
apiVersion: v1
kind: Service
metadata:
  name: argocd-region-__SHARD__
  namespace: argocd
spec:
  type: ExternalName
  externalName: region-__SHARD__-control-plane
  ports:
    - port: 30081  # argocd-server NodePort (../argocd-region/values.yaml)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-region-__SHARD__
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd-__SHARD__.localhost`)
      kind: Rule
      services:
        - name: argocd-region-__SHARD__
          port: 30081
