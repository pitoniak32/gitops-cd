# regional Argo CD (one per region cluster): region-independent values. Region bits (domain, url, OIDC
# client, labeled in-cluster Secret) are the valuesObject in ../../appsets/addons/argocd-region.yaml; the
# helm bootstrap in `gcd infra` (argocd.RegionValues) merges both. Same chart pin as the hub (platform/cli/internal/appsets test).
# Minimal: no dex or notifications.
configs:
  params:
    server.insecure: true  # tls terminated by the hub traefik, which proxies here (appsets/addons/argocd-region-hub.yaml)
    # traces -> this cluster's alloy (ADR 0031)
    otlp.address: alloy.alloy.svc.cluster.local:4317
    otlp.insecure: true
  cm:
    admin.enabled: false  # keycloak only; break-glass = kubectl (cluster admin)
  rbac:
    # email claim only (ADR 0011); teams read-only via generated AppProject `viewer-<app>` roles (ADR 0029); admins by email (ADR 0009)
    scopes: "[email]"
    policy.default: ""
    policy.csv: |
      g, admin@example.com, role:admin
server:
  service:
    type: NodePort
    nodePortHttp: 30081  # hub traefik proxies https://argocd-<region>.localhost here (appsets/addons/argocd-region-hub.yaml)
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1  # runs the root app's ApplicationSets (cluster generator, ADR 0017)
controller:
  metrics:
    # argocd_app_labels{label_example_com_<x>}: the CD pipeline dashboard joins it to argocd_app_info (ADR 0031)
    applicationLabels:
      enabled: true
      labels: [example.com/system, example.com/app, example.com/stage, example.com/target]
