# Break-glass guard (ADR 0013, docs/break-glass.md). Self-contained: delete the `break-glass` Argo CD app and
# Kargo approvals go straight to kargo-api again (any promoter can approve).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass
  namespace: kargo
---
# read the example.com/break-glass annotation on Stages; nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: break-glass-guard
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [stages]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: break-glass-guard
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: break-glass-guard}
subjects: [{kind: ServiceAccount, name: break-glass, namespace: kargo}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: break-glass
  namespace: kargo
spec:
  replicas: 1
  selector: {matchLabels: {app: break-glass}}
  template:
    metadata:
      labels: {app: break-glass}
    spec:
      serviceAccountName: break-glass
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: guard
          image: python:3.13.5-alpine3.22
          command: [python, -u, /app/guard.py]
          env:
            # keep in sync with Kargo admins.claims.email / Argo CD policy.csv (ADR 0009)
            - {name: ADMIN_EMAILS, value: admin@example.com}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
      volumes:
        - name: app
          configMap: {name: break-glass-guard}  # hashed by kustomize: code change -> rollout
---
apiVersion: v1
kind: Service
metadata:
  name: break-glass
  namespace: kargo
spec:
  selector: {app: break-glass}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: break-glass
  namespace: kargo
spec:
  forwardAuth:
    address: http://break-glass.kargo.svc.cluster.local:8080/check
---
# Only Freight approval goes through the guard; everything else uses kargo-config's route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kargo-approve
  namespace: kargo
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`kargo.localhost`) &&
        (PathRegexp(`^/v1beta1/projects/[^/]+/freight/[^/]+/approve$`) ||
         PathPrefix(`/akuity.io.kargo.service.v1alpha1.KargoService/ApproveFreight`))
      kind: Rule
      priority: 1000
      middlewares:
        - name: break-glass
      services:
        - name: kargo-api
          port: 443
          scheme: https
          serversTransport: kargo-transport  # from kargo-config
