apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-ctrl-__SHARD__
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    # templated per region (__SHARD__ = name in platform/cluster/regions) by mise-tasks/infra-render;
    # targetRevision is overwritten there with the pin in ../kargo/app.yaml
    targetRevision: PINNED-IN-KARGO-APP
    # helm.valuesObject filled from values.yaml by mise-tasks/infra-render
    helm:
      releaseName: kargo-ctrl-__SHARD__
      valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 5s, factor: 2, maxDuration: 1m }
