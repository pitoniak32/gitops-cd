apiVersion: v1
kind: Namespace
metadata:
  name: kargo-search
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-search
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-search
  namespace: kargo-search
spec:
  promotionPolicies:
    - stageSelector:
        name: api-dev
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: api
  namespace: kargo-search
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/search/api/
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: api-dev
  namespace: kargo-search
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: api
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/search/api/dev/
        - name: branch
          value: env/search/api/dev
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote search/api to dev from ${{ commitFrom(vars.repo).ID }}
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: search-api-gcp-dev
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: api-prod
  namespace: kargo-search
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: api
      sources:
        stages:
          - api-dev
        availabilityStrategy: All
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/search/api/prod/
        - name: branch
          value: env/search/api/prod
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote search/api to prod from ${{ commitFrom(vars.repo).ID }}
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: search-api-gcp-prod
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
              - name: search-api-onprem-prod
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owner-team2
  namespace: kargo-search
  labels:
    app.kubernetes.io/managed-by: gitops-platform
  annotations:
    rbac.kargo.akuity.io/managed: "true"
    rbac.kargo.akuity.io/claims: '{"groups":["team2"]}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owner-team2
  namespace: kargo-search
  labels:
    app.kubernetes.io/managed-by: gitops-platform
  annotations:
    rbac.kargo.akuity.io/managed: "true"
rules:
  - apiGroups:
      - kargo.akuity.io
    resources:
      - stages
    resourceNames:
      - api-dev
      - api-prod
    verbs:
      - promote
  - apiGroups:
      - kargo.akuity.io
    resources:
      - freights
      - stages
      - warehouses
      - promotions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owner-team2
  namespace: kargo-search
  labels:
    app.kubernetes.io/managed-by: gitops-platform
  annotations:
    rbac.kargo.akuity.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: owner-team2
subjects:
  - kind: ServiceAccount
    name: owner-team2
    namespace: kargo-search
