apiVersion: v1
kind: ServiceAccount
metadata:
  name: promote-dev
  namespace: kargo-search-api
  labels:
    app.kubernetes.io/managed-by: gitops-platform
  annotations:
    rbac.kargo.akuity.io/managed: "true"
    rbac.kargo.akuity.io/claims: '{"email":["alice@example.com"]}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promote-dev
  namespace: kargo-search-api
  labels:
    app.kubernetes.io/managed-by: gitops-platform
  annotations:
    rbac.kargo.akuity.io/managed: "true"
rules:
  - apiGroups:
      - kargo.akuity.io
    resources:
      - stages
    resourceNames:
      - us-east4-dev-k8s
    verbs:
      - promote
  - apiGroups:
      - kargo.akuity.io
    resources:
      - promotions
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - kargo.akuity.io
    resources:
      - freights
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promote-dev
  namespace: kargo-search-api
  labels:
    app.kubernetes.io/managed-by: gitops-platform
  annotations:
    rbac.kargo.akuity.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promote-dev
subjects:
  - kind: ServiceAccount
    name: promote-dev
    namespace: kargo-search-api
---
