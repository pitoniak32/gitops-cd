apiVersion: v1
kind: Namespace
metadata:
  name: kargo-search-api
  labels:
    kargo.akuity.io/project: "true"
    example.com/system: search
    example.com/app: api
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-search-api
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-search-api
  namespace: kargo-search-api
spec:
  promotionPolicies:
    - stageSelector:
        name: us-east4-dev-k8s
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: api
  namespace: kargo-search-api
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/search/api/
    - image:
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: us-east4-dev-k8s
  namespace: kargo-search-api
  labels:
    example.com/system: search
    example.com/app: api
    example.com/kind: target
    example.com/stage: dev
    example.com/target: us-east4-dev-k8s
    example.com/deploy-with: argocd
    example.com/platform: k8s
  annotations:
    example.com/break-glass: '[]'
    kargo.akuity.io/color: blue
spec:
  shard: us-east4
  requestedFreight:
    - origin:
        kind: Warehouse
        name: api
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/search/api/dev/us-east4-dev-k8s/
        - name: branch
          value: env/search/api/us-east4-dev-k8s
        - name: image
          value: ghcr.io/pitoniak32/nginx
        - name: system
          value: search
        - name: app
          value: api
        - name: stage
          value: dev
        - name: target
          value: us-east4-dev-k8s
        - name: pinFile
          value: ./out/deployment.yaml
        - name: pinKey
          value: spec.template.spec.containers.0.image
        - name: artifactKey
          value: image
      steps:
        - as: promote
          task:
            kind: ClusterPromotionTask
            name: promote-argocd
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: us-east4-prd-k8s
  namespace: kargo-search-api
  labels:
    example.com/system: search
    example.com/app: api
    example.com/kind: target
    example.com/stage: prod
    example.com/target: us-east4-prd-k8s
    example.com/deploy-with: argocd
    example.com/platform: k8s
  annotations:
    example.com/break-glass: '[]'
    kargo.akuity.io/color: amber
    example.com/pre-deploy: pitoniak32/gitops-cd/precheck.yaml@main
spec:
  shard: us-east4
  requestedFreight:
    - origin:
        kind: Warehouse
        name: api
      sources:
        stages:
          - us-east4-dev-k8s
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/search/api/prod/us-east4-prd-k8s/
        - name: branch
          value: env/search/api/us-east4-prd-k8s
        - name: image
          value: ghcr.io/pitoniak32/nginx
        - name: system
          value: search
        - name: app
          value: api
        - name: stage
          value: prod
        - name: target
          value: us-east4-prd-k8s
        - name: pinFile
          value: ./out/deployment.yaml
        - name: pinKey
          value: spec.template.spec.containers.0.image
        - name: artifactKey
          value: image
      steps:
        - as: pre-1
          task:
            kind: ClusterPromotionTask
            name: gha-check
          vars:
            - name: workflowRepo
              value: pitoniak32/gitops-cd
            - name: workflowFile
              value: precheck.yaml
            - name: workflowRef
              value: main
            - name: checkTimeout
              value: 30m
        - as: promote
          task:
            kind: ClusterPromotionTask
            name: promote-argocd
---
