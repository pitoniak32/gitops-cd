apiVersion: v1
kind: Namespace
metadata:
  name: kargo-payments
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-payments
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-payments
  namespace: kargo-payments
spec:
  promotionPolicies:
    - stageSelector:
        name: my-app-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-dev-done
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-onprem-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-prod
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-staging
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-us-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: worker-us-dev
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: my-app
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/my-app/
    - image:
        constraint: ^1
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: worker
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/worker/
    - image:
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-dev-done
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: control-flow
    example.com/stage: dev
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        availabilityStrategy: All
        stages:
          - my-app-onprem-dev
          - my-app-us-dev
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-prod
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: control-flow
    example.com/stage: prod
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
    kargo.akuity.io/color: violet
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        availabilityStrategy: All
        stages:
          - my-app-onprem-stg
          - my-app-us-perf
          - my-app-us-stg
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-dev
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: control-flow
    example.com/stage: dev
  annotations:
