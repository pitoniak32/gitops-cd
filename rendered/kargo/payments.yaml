apiVersion: v1
kind: Namespace
metadata:
  name: kargo-payments
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-payments
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-payments
  namespace: kargo-payments
spec:
  promotionPolicies:
    - stageSelector:
        name: my-app-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: worker-dev
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: my-app
  namespace: kargo-payments
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/my-app/
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: worker
  namespace: kargo-payments
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: main
        includePaths:
          - regexp:^rendered/apps/payments/worker/
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-dev
  namespace: kargo-payments
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/my-app/dev/
        - name: branch
          value: env/payments/my-app/dev
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote payments/my-app to dev from ${{ commitFrom(vars.repo).ID }}
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: payments-my-app-us-east4-dev
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
              - name: payments-my-app-on-prem-dev
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
