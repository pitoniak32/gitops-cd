    - origin:
        kind: Warehouse
        name: my-app
      sources:
        stages:
          - my-app-dev-done
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-us-dev
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: target
    example.com/stage: dev
    example.com/target: us-dev
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
    kargo.akuity.io/color: blue
spec:
  shard: us
  requestedFreight:
    - origin:
        kind: Warehouse
        name: my-app
      sources:
        stages:
          - my-app-dev
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/my-app/dev/us-dev/
        - name: branch
          value: env/payments/my-app/us-dev
        - name: image
          value: ghcr.io/pitoniak32/nginx
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: yaml-update
          config:
            path: ./out/deployment.yaml
            updates:
              - key: spec.template.spec.containers.0.image
                value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}@${{ imageFrom(vars.image).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote payments/my-app to dev/us-dev from ${{ commitFrom(vars.repo).ID }}, image ${{ imageFrom(vars.image).Tag }}
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: payments-my-app-us-dev
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.repo }}
                    desiredRevision: ${{ outputs.commit.commit }}
---
