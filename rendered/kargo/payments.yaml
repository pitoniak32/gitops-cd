apiVersion: v1
kind: Namespace
metadata:
  name: kargo-payments
  labels:
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-payments
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-payments
  namespace: kargo-payments
spec:
  promotionPolicies:
    - stageSelector:
        name: infra-us-east4-dev-tf
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-dc1-dev-k8s
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-dev-done
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-prod
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-staging
      autoPromotionEnabled: true
    - stageSelector:
        name: my-app-us-east4-dev-k8s
      autoPromotionEnabled: true
    - stageSelector:
        name: worker-us-east4-dev-k8s
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: infra
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/payments/infra/
    - image:
        repoURL: ghcr.io/pitoniak32/tf-bucket
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: my-app
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/payments/my-app/
    - image:
        constraint: ^1
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: worker
  namespace: kargo-payments
spec:
  freightCreationPolicy: Manual
  subscriptions:
    - git:
        repoURL: https://github.com/pitoniak32/gitops-cd
        branch: rendered
        includePaths:
          - regexp:^rendered/apps/payments/worker/
    - image:
        repoURL: ghcr.io/pitoniak32/nginx
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: my-app-dev-done
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/kind: control-flow
    example.com/stage: dev
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
