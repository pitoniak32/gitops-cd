apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: infra-us-east4-dev-tf
  namespace: kargo-payments
  labels:
    example.com/capability: payments
    example.com/app: infra
    example.com/kind: target
    example.com/stage: dev
    example.com/target: us-east4-dev-tf
    example.com/deploy-with: gha
    example.com/platform: terraform
  annotations:
    example.com/break-glass: '["oncall@example.com"]'
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: infra
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repo
          value: https://github.com/pitoniak32/gitops-cd
        - name: src
          value: ./src/rendered/apps/payments/infra/dev/us-east4-dev-tf/
        - name: branch
          value: env/payments/infra/us-east4-dev-tf
        - name: image
          value: ghcr.io/pitoniak32/tf-bucket
        - name: workflowRepo
          value: pitoniak32/gitops-cd
        - name: workflowFile
          value: terraform.yaml
        - name: workflowRef
          value: main
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repo }}
            checkout:
              - commit: ${{ commitFrom(vars.repo).ID }}
                path: ./src
              - branch: ${{ vars.branch }}
                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out
        - uses: copy
          config:
            inPath: ${{ vars.src }}
            outPath: ./out/
        - uses: yaml-update
          config:
            path: ./out/terraform.yaml
            updates:
              - key: module
                value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}@${{ imageFrom(vars.image).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: promote payments/infra to dev/us-east4-dev-tf from ${{ commitFrom(vars.repo).ID }}, module ${{ imageFrom(vars.image).Tag }}
        - uses: git-push
          config:
            path: ./out
        - uses: http
          as: dispatch
          config:
            method: POST
            url: https://api.github.com/repos/${{ vars.workflowRepo }}/actions/workflows/${{ vars.workflowFile }}/dispatches
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('github-actions').token }}
              - name: Accept
                value: application/vnd.github+json
              - name: X-GitHub-Api-Version
                value: "2022-11-28"
              - name: Content-Type
                value: application/json
            body: '${{ quote({''ref'': vars.workflowRef, ''return_run_details'': true, ''inputs'': {''capability'': ''payments'', ''app'': ''infra'', ''stage'': ''dev'', ''target'': ''us-east4-dev-tf'', ''commit'': outputs.commit.commit, ''module'': vars.image + '':'' + imageFrom(vars.image).Tag + ''@'' + imageFrom(vars.image).Digest} }) }}'
            successExpression: response.status == 200
            failureExpression: response.status != 200
            errorExpression: response.body.message
            outputs:
              - name: runID
                fromExpression: response.body.workflow_run_id
              - name: runURL
                fromExpression: response.body.html_url
        - uses: http
          as: wait
          retry:
            timeout: 60m
          config:
            method: GET
            url: https://api.github.com/repos/${{ vars.workflowRepo }}/actions/runs/${{ outputs.dispatch.runID }}
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('github-actions').token }}
              - name: Accept
                value: application/vnd.github+json
              - name: X-GitHub-Api-Version
                value: "2022-11-28"
            successExpression: response.status == 200 && response.body.status == 'completed' && response.body.conclusion == 'success'
            failureExpression: (response.status != 200 && response.status != 404) || (response.status == 200 && response.body.status == 'completed' && response.body.conclusion != 'success')
            errorExpression: 'response.status != 200 ? response.body.message : ''run '' + string(response.body.id) + '' '' + response.body.conclusion + '': '' + response.body.html_url'
---
