apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-staging@team1-staging.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: worker
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: us-east1-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: worker
  namespace: team1-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: worker
    example.com/capability: payments
    example.com/stage: staging
    example.com/target: us-east1-stg
    example.com/environment: staging
    example.com/billing: nonprod
  name: worker
  namespace: team1-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: worker
        example.com/capability: payments
        example.com/stage: staging
        example.com/target: us-east1-stg
        example.com/environment: staging
        example.com/billing: nonprod
    spec:
      containers:
        - image: ghcr.io/acme/worker:2.0.0
          name: worker
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: worker
