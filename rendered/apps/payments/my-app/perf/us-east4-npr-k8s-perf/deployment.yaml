apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: perf
    example.com/target: us-east4-npr-k8s-perf
    example.com/environment: perf
    example.com/environment-type: npr
    example.com/billing: nonprod
  name: my-app
  namespace: payments-us-perf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/capability: payments
        example.com/stage: perf
        example.com/target: us-east4-npr-k8s-perf
        example.com/environment: perf
        example.com/environment-type: npr
        example.com/billing: nonprod
    spec:
      containers:
        - env:
            - name: APP_ENV
              value: "true"
            - name: NEW_VARIABLE
              value: testing
            - name: DIFFERENT_SECRET
              value: /test@3
          image: ghcr.io/pitoniak32/nginx
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: my-app
