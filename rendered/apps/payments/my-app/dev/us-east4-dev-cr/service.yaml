apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: my-app
  namespace: team1-stg
  labels:
    app: my-app
    cloud.googleapis.com/location: us-east4
    managed-by: cue-platform
    system: payments
    stage: dev
    target: us-east4-dev-cr
    environment: dev
    environment-type: dev
    billing: dev
spec:
  template:
    metadata:
      labels:
        app: my-app
        managed-by: cue-platform
        system: payments
        stage: dev
        target: us-east4-dev-cr
        environment: dev
        environment-type: dev
        billing: dev
      annotations:
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/secrets: acme-dev-us-launchdarkly-sdk-key:projects/acme-dev-us/secrets/launchdarkly-sdk-key,acme-proj1-my-app-secret:projects/acme-proj1/secrets/my-app-secret
    spec:
      containerConcurrency: 1
      containers:
        - name: my-app
          image: ghcr.io/pitoniak32/nginx
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: "true"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: acme-proj1-my-app-secret
                  key: latest
            - name: LD_RELAY_URL
              value: https://ld-relay.us-dev.example.com
            - name: LD_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: acme-dev-us-launchdarkly-sdk-key
                  key: latest
            - name: LD_TENANT
              value: dev
            - name: NEW_VARIABLE
              value: testing
            - name: STAGE_ENV
              value: "false"
