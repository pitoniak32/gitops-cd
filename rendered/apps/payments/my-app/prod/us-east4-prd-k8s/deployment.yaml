apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/capability: payments
    example.com/stage: prod
    example.com/target: us-east4-prd-k8s
    example.com/environment: prod
    example.com/environment-type: prd
    example.com/billing: prod
  name: my-app
  namespace: payments-us-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/capability: payments
        example.com/stage: prod
        example.com/target: us-east4-prd-k8s
        example.com/environment: prod
        example.com/environment-type: prd
        example.com/billing: prod
    spec:
      containers:
        - env:
            - name: APP_ENV
              value: "true"
            - name: NEW_VAR
              value: testing
          image: ghcr.io/pitoniak32/nginx
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 512Mi
      serviceAccountName: my-app
