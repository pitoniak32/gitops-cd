apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-prod@team1-prod.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/system: payments
    example.com/stage: prod
    example.com/target: dc1-prd-k8s
    example.com/environment: prod
    example.com/environment-type: prd
    example.com/billing: prod
  name: my-app
  namespace: payments-onprem-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/system: payments
    example.com/stage: prod
    example.com/target: dc1-prd-k8s
    example.com/environment: prod
    example.com/environment-type: prd
    example.com/billing: prod
  name: my-app
  namespace: payments-onprem-prod
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: my-app
