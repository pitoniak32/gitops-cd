apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/system: payments
    example.com/stage: staging
    example.com/target: dc1-npr-k8s
    example.com/environment: staging
    example.com/environment-type: npr
    example.com/billing: nonprod
  name: my-app
  namespace: payments-onprem-stg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/system: payments
        example.com/stage: staging
        example.com/target: dc1-npr-k8s
        example.com/environment: staging
        example.com/environment-type: npr
        example.com/billing: nonprod
    spec:
      containers:
        - env:
            - name: SDK_CONFIG_EXAMPLE
              value: changeme
            - name: APP_ENV
              value: "true"
            - name: NEW_VARIABLE
              value: testing
          image: ghcr.io/pitoniak32/nginx
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: my-app
