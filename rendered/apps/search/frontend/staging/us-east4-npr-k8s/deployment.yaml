apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: frontend
    example.com/system: search
    example.com/stage: staging
    example.com/target: us-east4-npr-k8s
    example.com/environment: staging
    example.com/environment-type: npr
    example.com/billing: staging
  name: frontend
  namespace: search-us-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: frontend
        example.com/system: search
        example.com/stage: staging
        example.com/target: us-east4-npr-k8s
        example.com/environment: staging
        example.com/environment-type: npr
        example.com/billing: staging
    spec:
      containers:
        - env:
            - name: FF_VALUE
              value: "true"
          image: ghcr.io/pitoniak32/nginx
          name: frontend
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: frontend
