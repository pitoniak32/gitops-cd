apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: frontend
    example.com/system: search
    example.com/stage: prod
    example.com/target: dc1-prd-k8s
    example.com/environment: prod
    example.com/environment-type: prd
    example.com/billing: prod
  name: frontend
  namespace: search-onprem-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: frontend
        example.com/system: search
        example.com/stage: prod
        example.com/target: dc1-prd-k8s
        example.com/environment: prod
        example.com/environment-type: prd
        example.com/billing: prod
    spec:
      containers:
        - image: ghcr.io/pitoniak32/nginx
          name: frontend
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: frontend
