apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team2-prod@team2-prod.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: prod
    example.com/target: gcp-prod
    example.com/environment: prod
    example.com/billing: prod
  name: api
  namespace: team2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: prod
    example.com/target: gcp-prod
    example.com/environment: prod
    example.com/billing: prod
  name: api
  namespace: team2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: api
        example.com/capability: search
        example.com/stage: prod
        example.com/target: gcp-prod
        example.com/environment: prod
        example.com/billing: prod
    spec:
      containers:
        - image: ghcr.io/acme/team2-api:0.9.0
          name: api
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: api
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: prod
    example.com/target: gcp-prod
    example.com/environment: prod
    example.com/billing: prod
  name: api
  namespace: team2
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: api
