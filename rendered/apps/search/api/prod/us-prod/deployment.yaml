apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: prod
    example.com/target: us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: api
  namespace: search-us-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: api
        example.com/capability: search
        example.com/stage: prod
        example.com/target: us-prod
        example.com/environment: prod
        example.com/billing: prod
    spec:
      containers:
        - image: ghcr.io/pitoniak32/nginx
          name: api
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: api
