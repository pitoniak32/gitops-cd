apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team2-prod@team2-prod.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: prod
    example.com/target: us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: api
  namespace: search-us-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: prod
    example.com/target: us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: api
  namespace: search-us-prod
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: api
