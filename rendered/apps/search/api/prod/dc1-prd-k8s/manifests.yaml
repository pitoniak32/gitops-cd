apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team2-prod@team2-prod.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/system: search
    example.com/stage: prod
    example.com/target: dc1-prd-k8s
    example.com/environment: prod
    example.com/environment-type: prd
