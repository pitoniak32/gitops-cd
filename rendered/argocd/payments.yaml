apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: payments-gcp-eu-prod
    - name: in-cluster
      namespace: payments-gcp-us-prod
    - name: in-cluster
      namespace: payments-on-prem-dev
    - name: in-cluster
      namespace: payments-on-prem-perf
    - name: in-cluster
      namespace: payments-on-prem-prod-1
    - name: in-cluster
      namespace: payments-on-prem-prod-2
    - name: in-cluster
      namespace: payments-on-prem-stg
    - name: in-cluster
      namespace: payments-us-east1-perf
    - name: in-cluster
      namespace: payments-us-east1-stg
    - name: in-cluster
      namespace: payments-us-east4-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: viewer
      description: read-only view of payments apps for its promoters and viewers
      policies:
        - p, proj:payments:viewer, applications, get, payments/*, allow
      groups:
        - bob@example.com
        - doug@example.com
        - oncall@example.com
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-my-app-us-east4-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-payments:my-app-us-east4-dev
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/stage: dev
    example.com/target: us-east4-dev
spec:
  project: payments
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/payments/my-app/us-east4-dev
    path: .
  destination:
    name: in-cluster
    namespace: payments-us-east4-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
