apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: payments-onprem-dev
    - name: in-cluster
      namespace: payments-onprem-prod
    - name: in-cluster
      namespace: payments-onprem-stg
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: viewer-my-app
      description: read-only view of payments/my-app for its promoters and viewers
      policies:
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-dc1-dev-k8s, allow
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-dc1-npr-k8s, allow
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-dc1-prd-k8s, allow
      groups:
        - bob@example.com
        - doug@example.com
        - oncall@example.com
