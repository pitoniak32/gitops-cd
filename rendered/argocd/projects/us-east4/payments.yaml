apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: payments-us-dev
    - name: in-cluster
      namespace: payments-us-perf
    - name: in-cluster
      namespace: payments-us-prod
    - name: in-cluster
      namespace: payments-us-stg
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: viewer-my-app
      description: read-only view of payments/my-app for its promoters and viewers
      policies:
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-us-east4-dev-k8s, allow
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-us-east4-npr-k8s, allow
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-us-east4-npr-k8s-perf, allow
        - p, proj:payments:viewer-my-app, applications, get, payments/payments-my-app-us-east4-prd-k8s, allow
      groups:
        - bob@example.com
        - doug@example.com
        - grace@example.com
    - name: viewer-worker
      description: read-only view of payments/worker for its promoters and viewers
      policies:
        - p, proj:payments:viewer-worker, applications, get, payments/payments-worker-us-east4-prd-k8s, allow
      groups:
        - bob@example.com
        - doug@example.com
        - grace@example.com
