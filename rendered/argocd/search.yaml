apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: search
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/pitoniak32/gitops-cd
  destinations:
    - name: in-cluster
      namespace: search-gcp-dev
    - name: in-cluster
      namespace: search-gcp-prod
    - name: in-cluster
      namespace: search-onprem-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-api-gcp-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-search:api-dev
  labels:
    example.com/capability: search
    example.com/app: api
    example.com/stage: dev
    example.com/target: gcp-dev
spec:
  project: search
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/search/api/dev
    path: gcp-dev
  destination:
    name: in-cluster
    namespace: search-gcp-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-api-gcp-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-search:api-prod
  labels:
    example.com/capability: search
    example.com/app: api
    example.com/stage: prod
    example.com/target: gcp-prod
spec:
  project: search
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/search/api/prod
    path: gcp-prod
  destination:
    name: in-cluster
    namespace: search-gcp-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-api-onprem-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-search:api-prod
  labels:
    example.com/capability: search
    example.com/app: api
    example.com/stage: prod
    example.com/target: onprem-prod
spec:
  project: search
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: env/search/api/prod
    path: onprem-prod
  destination:
    name: in-cluster
    namespace: search-onprem-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
