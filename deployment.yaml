apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: my-app
    example.com/system: payments
    example.com/stage: dev
    example.com/target: us-east4-dev-k8s
    example.com/environment: dev
    example.com/environment-type: dev
    example.com/billing: dev
  name: my-app
  namespace: payments-us-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: my-app
        example.com/system: payments
        example.com/stage: dev
        example.com/target: us-east4-dev-k8s
        example.com/environment: dev
        example.com/environment-type: dev
        example.com/billing: dev
    spec:
      containers:
        - env:
            - name: LD_RELAY_URL
              value: https://ld-relay.us-dev.example.com
            - name: LD_TENANT
              value: dev
            - name: APP_ENV
              value: "true"
            - name: NEW_VARIABLE
              value: testing
            - name: STAGE_ENV
              value: "false"
            - name: NEW_DEV_VAR
              value: value
          image: ghcr.io/pitoniak32/nginx:1.0.1@sha256:f92fe65923f6b01f1c896b9b1d2c66f94da32084b46bc8654bafea504a53486f
          name: my-app
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: my-app
