apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: search-dev@search-dev.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: dev
    example.com/target: gcp-dev
    example.com/environment: dev
    example.com/billing: dev
  name: api
  namespace: search-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: dev
    example.com/target: gcp-dev
    example.com/environment: dev
    example.com/billing: dev
  name: api
  namespace: search-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: api
        example.com/capability: search
        example.com/stage: dev
        example.com/target: gcp-dev
        example.com/environment: dev
        example.com/billing: dev
    spec:
      containers:
        - image: ghcr.io/acme/search-api:1.0.0
          name: api
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: api
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: api
    example.com/capability: search
    example.com/stage: dev
    example.com/target: gcp-dev
    example.com/environment: dev
    example.com/billing: dev
  name: api
  namespace: search-dev
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: api
