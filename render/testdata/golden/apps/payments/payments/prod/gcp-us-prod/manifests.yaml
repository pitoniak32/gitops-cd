apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: team1-prod@team1-prod.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: payments
    example.com/capability: payments
    example.com/stage: prod
    example.com/target: gcp-us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: payments
  namespace: team1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: cue-platform
    app.kubernetes.io/name: payments
    example.com/capability: payments
    example.com/stage: prod
    example.com/target: gcp-us-prod
    example.com/environment: prod
    example.com/billing: prod
  name: payments
  namespace: team1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: cue-platform
        app.kubernetes.io/name: payments
        example.com/capability: payments
        example.com/stage: prod
        example.com/target: gcp-us-prod
        example.com/environment: prod
        example.com/billing: prod
    spec:
      containers:
        - image: ghcr.io/acme/worker:2.0.0
          name: payments
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: payments
