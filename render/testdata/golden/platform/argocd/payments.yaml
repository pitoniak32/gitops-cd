apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-my-app-us-east4-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-payments:my-app-dev
  labels:
    example.com/capability: payments
    example.com/app: my-app
    example.com/stage: dev
    example.com/target: us-east4-dev
spec:
  project: payments
  source:
    repoURL: https://github.com/acme/gitops
    targetRevision: env/payments/my-app/dev
    path: us-east4-dev
  destination:
    name: gke-use4-dev
    namespace: team1-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
