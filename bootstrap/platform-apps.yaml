# Apply once to the Argo CD control cluster. Syncs generated, team-level infra from main:
#   rendered/argocd/*.yaml -> Argo CD Applications (one per app+target, tracking env/* branches)
#   rendered/kargo/*.yaml  -> Kargo Projects, Warehouses, Stages
# Workload manifests (rendered/apps/**) are NOT synced from main; they reach clusters only via Kargo promotion.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generated-argocd-apps
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/acme/gitops
    targetRevision: main
    path: rendered/argocd
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generated-kargo
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/acme/gitops
    targetRevision: main
    path: rendered/kargo
  destination:
    name: kargo        # cluster running Kargo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
