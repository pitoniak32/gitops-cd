# Root Applications for generated config, applied by `mise run infra`. Sync from main on GitHub:
#   rendered/argocd/<cap>.yaml -> AppProject + Applications (one per app+target, tracking env/* branches)
#   rendered/kargo/<cap>.yaml  -> Kargo Projects, Warehouses, Stages, promote RBAC
# Workload manifests (rendered/apps/**) are NOT synced from main; they reach the cluster only via Kargo promotion.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rendered-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: main
    path: rendered/argocd
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rendered-kargo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pitoniak32/gitops-cd
    targetRevision: main
    path: rendered/kargo
  destination:
    name: in-cluster
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # backstop: Kargo must adopt each rendered project namespace before its resources apply cleanly
    retry:
      limit: 10
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
