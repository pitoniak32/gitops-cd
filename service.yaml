apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: worker
  namespace: team1-stg
  labels:
    app: worker
    cloud.googleapis.com/location: us-east4
    managed-by: cue-platform
    system: payments
    stage: staging
    target: us-east4-npr-cr
    environment: staging
    environment-type: npr
    billing: stg
spec:
  template:
    metadata:
      labels:
        app: worker
        managed-by: cue-platform
        system: payments
        stage: staging
        target: us-east4-npr-cr
        environment: staging
        environment-type: npr
        billing: stg
      annotations:
        autoscaling.knative.dev/minScale: "0"
    spec:
      containers:
        - name: worker
          image: ghcr.io/pitoniak32/nginx:1.1.0@sha256:c8fa106acc6d713fc0cf8c00906b1d54157ff9cb77f6aa3f65ba1c27348e4ce6
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
