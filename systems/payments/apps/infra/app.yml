# terraform app (ADR 0021): module pushed by `mise run tf-module-push`; env is exported by the workflow
module: ghcr.io/pitoniak32/tf-bucket
sourceRepo: pitoniak32/gitops-cd
stages:
  dev:
    targets:
      us-east4-dev-tf:
        env:
          TF_VAR_bucket_name: payments-dev-bucket
  staging:
    targets:
      us-east4-npr-tf:
        env:
          TF_VAR_bucket_name: payments-stg-bucket
