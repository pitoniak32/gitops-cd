# used for helm bootstrap AND argocd self-managing Application (keep identical; bootstrap skips extraObjects)
global:
  domain: argocd.localhost
configs:
  params:
    server.insecure: true  # tls terminated by traefik
  repositories:
    kargo-charts:
      type: helm
      name: kargo-charts
      url: ghcr.io/akuity/kargo-charts
      enableOCI: "true"
  cm:
    url: https://argocd.localhost
    # keycloak only; break-glass = kubectl (cluster admin)
    admin.enabled: false
    # local keycloak (infrastructure/keycloak/), public client + PKCE, no secret
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.localhost/realms/kargo
      clientID: argocd
      cliClientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: [openid, profile, email]
  rbac:
    # keycloak `groups` claim (client mapper on the argocd client)
    scopes: "[groups, email]"
    # no global access: users only see apps of capabilities their team owns, read-only, via the
    # generated AppProject `viewer` roles (rendered/argocd/<cap>.yaml). Kargo does all syncing.
    # Infrastructure apps (project `default`) are visible to nobody in the UI; use kubectl.
    policy.default: ""
    policy.csv: ""
server:
  # Ingress never gets an address with NodePort traefik -> stuck Progressing in argo; use IngressRoute
  ingress:
    enabled: false
dex:
  enabled: false
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server
      namespace: argocd
    spec:
      entryPoints: [websecure]
      routes:
        - match: Host(`argocd.localhost`)
          kind: Rule
          services:
            - name: argocd-server
              port: 80
