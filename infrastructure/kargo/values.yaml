api:
  host: kargo.localhost
  adminAccount:
    enabled: false
  secretManagementEnabled: false
  oidc:
    enabled: true
    # local keycloak (infrastructure/keycloak/); http so kargo-api needn't trust a self-signed CA
    issuerURL: http://keycloak.localhost/realms/kargo
    clientID: kargo
    dex:
      enabled: false
    # openid/profile/email always requested; chart default `groups` scope doesn't exist in keycloak realm
    additionalScopes: []
    # no OIDC admins: create/edit/delete only via gitops (see infrastructure/kargo-config/manifests/gitops-only.yaml)
    # promote rights: generated owner-<team> roles per capability project (rendered/kargo/)
    viewers:
      claims:
        email:
          - doug@example.com
          - alice@example.com
          - bob@example.com
