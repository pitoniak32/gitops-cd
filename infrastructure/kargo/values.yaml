api:
  host: kargo.localhost
  adminAccount:
    enabled: false
  secretManagementEnabled: false
  oidc:
    enabled: true
    # local keycloak (infrastructure/keycloak/); http so kargo-api needn't trust a self-signed CA
    issuerURL: http://keycloak.localhost/realms/kargo
    clientID: kargo
    dex:
      enabled: false
    # openid/profile/email always requested; `groups` claim comes from a client-level mapper on the
    # kargo client (keycloak realm), so no `groups` scope is requested (it doesn't exist in the realm)
    additionalScopes: []
    # platform-admins (keycloak group) = Kargo admin (ADR 0009): view/promote/approve everywhere;
    # create/edit/delete still blocked for everyone by infrastructure/kargo-config/manifests/gitops-only.yaml
    admins:
      claims:
        groups: [platform-admins]
    # teams: no global viewers/users; all access is generated per capability (rendered/kargo/<cap>.yaml):
    #   owner-<team> in kargo-<cap>: promote own apps' stages + Kargo's kargo-viewer Role (read project)
    #   users-<cap> in kargo-shared-resources: kargo-user (list project names), via the SAs below
    globalServiceAccounts:
      namespaces:
        - kargo-shared-resources
